<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية | FULL MARK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            background: #050a18; 
            color: white; 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 80px; 
            overflow-x: hidden; 
        }

        .bg-glow { 
            position: fixed; top: -20%; left: 50%; transform: translateX(-50%); 
            width: 150%; height: 600px; 
            background: radial-gradient(circle, rgba(60, 40, 160, 0.25) 0%, transparent 70%); 
            z-index: -1; pointer-events: none;
        }

        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; margin-bottom: 10px;
        }

        .icon-btn {
            width: 45px; height: 45px; border-radius: 14px;
            background: #111526; border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #5b6a8e; transition: 0.3s; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .icon-btn.power:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
        .icon-btn.crown:hover { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: #fbbf24; }

        .profile-area {
            display: flex; align-items: center; gap: 10px;
            background: #111526; padding: 5px 12px 5px 5px;
            border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .p-img-box {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #6366f1; padding: 2px; position: relative;
        }
        .p-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0f172a; }
        .p-status {
            position: absolute; bottom: 0; right: 0; width: 10px; height: 10px;
            background: #22c55e; border: 2px solid #111526; border-radius: 50%;
        }

        .main-title { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        .title-text {
            font-size: 1.8rem; font-weight: 900; color: #a5b4fc;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3); letter-spacing: 1px;
        }
        /* تكبير الخط في الشاشات الكبيرة */
        @media (min-width: 768px) {
            .title-text { font-size: 2.5rem; }
        }
        .subtitle-text {
            color: #64748b; font-size: 0.8rem; font-weight: 700;
            margin-top: -5px; position: relative; display: inline-block;
        }
        .subtitle-text::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 3px; background: #6366f1; border-radius: 2px;
        }

        /* كارت المادة المتجاوب */
        .subject-card {
            background: #10152a; border-radius: 25px; padding: 0;
            text-align: center; 
            /* ألغيت الطول الثابت عشان يبقى مرن */
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid transparent; transition: all 0.4s;
            cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
        }
        .subject-card:hover {
            transform: translateY(-8px); border-color: #3b4566;
            background: #151b33; box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
        }

        .s-img-container {
            width: 100%; height: 150px; overflow: hidden; position: relative;
            background: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        /* تكبير الصورة في اللاب توب */
        @media (min-width: 1024px) {
            .s-img-container { height: 180px; }
        }

        .s-img { 
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.5s; filter: brightness(0.85);
        }
        .subject-card:hover .s-img { transform: scale(1.05); filter: brightness(1); }

        .card-content {
            padding: 15px; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px;
        }
        .s-name { 
            font-size: 1.2rem; font-weight: 800; color: white; margin: 0; line-height: 1.4;
        }
        /* تكبير اسم المادة في اللاب توب */
        @media (min-width: 1024px) {
            .s-name { font-size: 1.4rem; }
        }

        .teacher-badge {
            background: #1e2540; color: #94a3b8;
            padding: 6px 14px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px; transition: 0.3s;
        }
        .subject-card:hover .teacher-badge { background: #6366f1; color: white; }

        .skeleton { background: #111526; border-radius: 25px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .footer-brand {
            text-align: center; margin-top: 50px; padding: 20px;
            font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; color: #334155;
            text-transform: uppercase; border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div id="app">
        <header class="header-container">
            <div class="flex gap-2">
                <div @click="logout" class="icon-btn power"><i class="fas fa-power-off"></i></div>
                <a href="profile.html" class="icon-btn crown"><i class="fas fa-crown"></i></a>
            </div>
            <div class="profile-area">
                <div class="text-right hidden sm:block"> <h2 class="text-white font-bold text-sm leading-tight" id="sName">...</h2>
                    <p class="text-[10px] text-indigo-400 font-bold">بطل الثانوية 🎓</p>
                </div>
                <div class="p-img-box">
                    <img src="https://img.freepik.com/free-psd/3d-illustration-person-with-sunglasses_23-2149436188.jpg" class="p-img">
                    <div class="p-status"></div>
                </div>
            </div>
        </header>

        <div class="main-title">
            <h1 class="title-text">نظام FULL MARK</h1>
            <p class="subtitle-text">مسارك للتفوق</p>
        </div>

        <div class="px-4 md:px-8 max-w-[1400px] mx-auto">
            <div v-if="loading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                <div v-for="i in 4" class="skeleton h-[260px]"></div>
            </div>

            <div v-else class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                <div v-for="s in subjects" :key="s.id" @click="go(s)" class="subject-card group">
                    <div class="s-img-container">
                        <img :src="getImg(s.name)" class="s-img" loading="lazy" onerror="this.src='images/default.jpg'">
                    </div>
                    <div class="card-content">
                        <h3 class="s-name">{{ s.name }}</h3>
                        <div class="teacher-badge">
                            <i class="fas fa-chalkboard-user"></i>
                            <span>{{ s.teachers ? s.teachers.length : 0 }} معلمين</span>
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="!loading && subjects.length === 0" class="text-center py-20 opacity-50">
                <i class="fas fa-box-open text-4xl mb-2"></i>
                <p>لا توجد مواد متاحة حالياً</p>
            </div>
        </div>

        <div class="footer-brand">ELGIZAWY • DEVELOPMENT</div>
    </div>

    <script>
        // ✅ قاعدة البيانات (الصور)
        const IMAGES_DB = {
            "لغة عربية": "images/arabic.jpg",
            "فيزياء": "images/physics.jpg",
            "كيمياء": "images/chemistry.jpg",
            "أحياء": "images/biology.jpg",
            "رياضيات": "images/math.jpg",
            "تاريخ": "images/history.jpg",
            "جيولوجيا": "images/physics.jpg",
            
            // more_images
            "english": "more_images/english (3).jpg",
            "french": "more_images/french (1).jpg",
            "geo": "more_images/geo (2).jpg",
            "stats": "more_images/stats.jpg",

            "default": "images/arabic.jpg"
        };

        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const subjects = ref([]);
                const loading = ref(true);
                const yid = ref(null);

                // دالة جلب الصور (نفس اللوجيك السليم)
                const getImg = (n) => {
                    const name = n.toLowerCase();
                    if (name.includes('عربي') || name.includes('arabic')) return IMAGES_DB["لغة عربية"];
                    if (name.includes('فيزياء') || name.includes('physics')) return IMAGES_DB["فيزياء"];
                    if (name.includes('كيمياء') || name.includes('chemistry')) return IMAGES_DB["كيمياء"];
                    if (name.includes('أحياء') || name.includes('biology')) return IMAGES_DB["أحياء"];
                    if (name.includes('رياضيات') || name.includes('math')) return IMAGES_DB["رياضيات"];
                    if (name.includes('تاريخ') || name.includes('history')) return IMAGES_DB["تاريخ"];
                    
                    if (name.includes('english') || name.includes('انجليزي')) return IMAGES_DB["english"];
                    if (name.includes('جغرافيا') || name.includes('geo')) return IMAGES_DB["geo"];
                    if (name.includes('فرنساوي') || name.includes('french') || name.includes('français')) return IMAGES_DB["french"];
                    if (name.includes('إحصاء') || name.includes('stats')) return IMAGES_DB["stats"];

                    if (name.includes('جيولوجيا')) return IMAGES_DB["جيولوجيا"];

                    return IMAGES_DB['default'];
                };

                const logout = () => { 
                    if(confirm("هل تريد تسجيل الخروج؟")) {
                        localStorage.removeItem('alpha_user_code'); 
                        window.location.href = 'index.html'; 
                    }
                };

                const go = (s) => {
                    window.location.href = `teachers.html?yid=${yid.value}&sid=${s.id}`;
                };

                onMounted(async () => {
                    const code = checkAuth();
                    if(!code) return;

                    const db = firebase.database();
                    try {
                        const userSnap = await db.ref('approvedStudents/'+code).once('value');
                        const user = userSnap.val();
                        if(user) {
                            const nameEl = document.getElementById('sName');
                            if(nameEl) nameEl.innerText = user.studentName;
                        }

                        const URLS = { 
                            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json", 
                            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
                            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json",
                            'أزهر': "https://plus-teal.vercel.app/organized_output.json"
                        };

                        const targetURL = URLS[user.section] || URLS['علمي علوم'];
                        
                        const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve('TIMEOUT'), 5000));
                        const fetchPromise = fetch(targetURL).then(res => res.json());
                        const data = await Promise.race([fetchPromise, timeoutPromise]);

                        if(data === 'TIMEOUT') throw new Error("تأخر الاتصال بالسيرفر");
                        
                        let year = data.find(y => y.id == 3) || data[0];
                        yid.value = year.id;
                        subjects.value = year.subjects || [];

                    } catch (e) { 
                        console.error(e);
                        // fallback
                        const fallbackRes = await fetch("https://plus-teal.vercel.app/organized_output.json");
                        const fallbackData = await fallbackRes.json();
                        let year = fallbackData.find(y => y.id == 3);
                        subjects.value = year.subjects || [];
                    } finally { 
                        loading.value = false; 
                    }
                });

                return { subjects, loading, getImg, logout, go };
            }
        }).mount('#app');
    </script>
</body>
</html>
