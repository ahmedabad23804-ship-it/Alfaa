<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية | FULL MARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            background: #000; 
            color: white; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* خلفية احترافية متحركة */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.2), transparent 25%);
            background-color: #030712;
        }

        /* الهيدر الزجاجي */
        .glass-header {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 50;
        }

        /* كارت المادة */
        .subject-card {
            position: relative;
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .subject-card:hover {
            transform: translateY(-8px);
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 20px 40px -12px rgba(124, 58, 237, 0.3);
        }

        /* تأثير اللمعان */
        .subject-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg); transition: 0.5s;
        }
        .subject-card:hover::before { left: 150%; }

        /* الأيقونة */
        .icon-box {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.4s;
        }
        .subject-card:hover .icon-box {
            background: linear-gradient(135deg, #6d28d9, #4c1d95);
            border-color: transparent;
            transform: scale(1.1) rotate(5deg);
        }

        .img-icon { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

        .loading-shimmer {
            background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div class="animated-bg"></div>

    <div id="app">
        
        <header class="glass-header px-6 py-4 flex justify-between items-center">
            <div @click="goToProfile" class="flex items-center gap-3 cursor-pointer group hover:opacity-80 transition">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full p-[2px] bg-gradient-to-tr from-indigo-500 to-fuchsia-500">
                        <img src="https://img.freepik.com/free-psd/3d-illustration-person-with-sunglasses_23-2149436188.jpg" 
                             class="w-full h-full rounded-full object-cover bg-slate-900 border-2 border-slate-900">
                    </div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full animate-pulse"></div>
                </div>
                <div>
                    <p class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">أهلاً يا بطل 👋</p>
                    <h2 class="font-bold text-lg leading-tight group-hover:text-indigo-300 transition">{{ studentName }}</h2>
                </div>
            </div>

            <div>
                <button onclick="logout()" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center border border-red-500/20 hover:bg-red-500 hover:text-white transition shadow-lg">
                    <i class="fas fa-power-off text-sm"></i>
                </button>
            </div>
        </header>

        <main class="px-6 py-8 max-w-6xl mx-auto">
            
            <div class="mb-10 text-center md:text-right">
                <h1 class="text-3xl md:text-4xl font-black mb-2 bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent font-['Outfit']">
                    Study Smart, Not Hard 🚀
                </h1>
                <p class="text-gray-400 text-sm font-medium">كل المواد اللي محتاجها عشان تقفل الدرجة النهائية</p>
            </div>

            <div v-if="loading" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <div v-for="n in 4" class="h-56 rounded-3xl loading-shimmer border border-white/5"></div>
            </div>

            <div v-else class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <div v-for="s in subjects" :key="s.id" @click="openSubject(s)" class="subject-card group">
                    <div class="flex justify-between items-start">
                        <div class="icon-box">
                            <img :src="getImage(s.name)" class="img-icon">
                        </div>
                        <span class="text-[10px] bg-white/5 px-2 py-1 rounded-lg text-gray-400 font-bold border border-white/5">
                            {{ s.teachers ? s.teachers.length : 0 }} مدرس
                        </span>
                    </div>
                    
                    <h3 class="text-xl font-bold mb-1 group-hover:text-indigo-400 transition">{{ s.name }}</h3>
                    <p class="text-xs text-gray-500">اضغط للدخول</p>
                    
                    <div class="absolute bottom-4 left-4 opacity-0 transform translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition duration-300">
                        <i class="fas fa-arrow-left text-indigo-400"></i>
                    </div>
                </div>
            </div>

            <div v-if="!loading && subjects.length === 0" class="text-center py-20">
                <div class="inline-block p-6 rounded-full bg-slate-800/50 mb-4">
                    <i class="fas fa-search text-3xl text-gray-600"></i>
                </div>
                <p class="text-gray-500">جاري إضافة المواد قريباً...</p>
            </div>

        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const subjects = ref([]);
                const studentName = ref('جاري التحميل...');
                const loading = ref(true);
                const yid = ref(null);

                // الانتقال لصفحة البروفايل
                const goToProfile = () => {
                    window.location.href = 'profile.html';
                };

                // الانتقال للمدرسين
                const openSubject = (s) => {
                    window.location.href = `teachers.html?yid=${yid.value}&sid=${s.id}`;
                };

                // أيقونات المواد
                const getImage = (name) => {
                    const n = name.toLowerCase();
                    if(n.includes('english') || n.includes('إنجليزي')) return 'https://cdn-icons-png.flaticon.com/512/3269/3269817.png';
                    if(n.includes('arabic') || n.includes('عربي')) return 'https://cdn-icons-png.flaticon.com/512/3389/3389081.png';
                    if(n.includes('physics') || n.includes('فيزياء')) return 'https://cdn-icons-png.flaticon.com/512/3081/3081530.png';
                    if(n.includes('chemistry') || n.includes('كيمياء')) return 'https://cdn-icons-png.flaticon.com/512/1233/1233262.png';
                    if(n.includes('math') || n.includes('رياضيات')) return 'https://cdn-icons-png.flaticon.com/512/4091/4091410.png';
                    if(n.includes('bio') || n.includes('أحياء')) return 'https://cdn-icons-png.flaticon.com/512/2990/2990212.png';
                    if(n.includes('history') || n.includes('تاريخ')) return 'https://cdn-icons-png.flaticon.com/512/2234/2234665.png';
                    if(n.includes('geo') || n.includes('جغرافيا')) return 'https://cdn-icons-png.flaticon.com/512/2947/2947656.png';
                    if(n.includes('french') || n.includes('فرنساوي')) return 'https://cdn-icons-png.flaticon.com/512/330/330490.png';
                    return 'https://cdn-icons-png.flaticon.com/512/2232/2232688.png';
                };

                onMounted(async () => {
                    const code = checkAuth();
                    if(!code) return;

                    const db = firebase.database();
                    try {
                        const snap = await db.ref('approvedStudents/'+code).once('value');
                        const user = snap.val();
                        if(user) studentName.value = user.studentName;

                        const URLS = { 
                            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json", 
                            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
                            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json",
                            'أزهر': "https://plus-teal.vercel.app/organized_output.json"
                        };

                        const res = await fetch(URLS[user.section] || URLS['علمي علوم']);
                        const data = await res.json();
                        const year = data.find(y => y.id == 3) || data[0];
                        
                        yid.value = year.id;
                        subjects.value = year.subjects || [];
                    } catch(e) { console.error(e); } 
                    finally { loading.value = false; }
                });

                return { subjects, studentName, loading, getImage, openSubject, goToProfile };
            }
        }).mount('#app');
    </script>
</body>
</html>
