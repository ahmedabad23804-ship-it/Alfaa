<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية | FULL MARK</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 🎨 ثيم منصة FULL MARK */
        :root {
            --bg-dark: #00040f;
            --card-bg: rgba(30, 41, 59, 0.4);
            --gold: #fbbf24;
            --blue-glow: #3b82f6;
        }

        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* 🌌 خلفية النجوم والتوهج */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: radial-gradient(circle at 50% 0%, rgba(29, 78, 216, 0.25), rgba(88, 28, 135, 0.15), #00040f 80%);
        }
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }
        .star {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
            animation: twinkle var(--duration) infinite ease-in-out; opacity: 0;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }

        /* 👤 الهيدر العلوي */
        .glass-header {
            background: rgba(2, 6, 23, 0.85);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
        }

        /* 💪 شريط التحفيز */
        .motivation-bar {
            background: linear-gradient(90deg, rgba(30, 58, 138, 0.4), rgba(88, 28, 135, 0.4));
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px; text-align: center;
            font-size: 0.9rem; color: var(--gold); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        /* 🏷️ عنوان المنصة */
        .branding-title {
            text-align: center; margin: 30px 0 20px;
        }
        .branding-text {
            font-family: 'Cairo', sans-serif;
            font-size: 2.5rem; font-weight: 900;
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(251, 191, 36, 0.2);
            letter-spacing: 2px;
        }

        /* 📚 شبكة المواد */
        #subjects-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px;
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
            list-style: none;
        }

        @media (min-width: 768px) {
            #subjects-list { grid-template-columns: repeat(4, 1fr); }
        }

        /* 🃏 كارت المادة */
        .subject-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            height: 180px;
            display: flex; flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 15px 30px -10px rgba(251, 191, 36, 0.2);
        }

        /* صورة المادة */
        .img-area {
            height: 110px; width: 100%; overflow: hidden; position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .real-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.8); transition: 0.5s;
        }
        .subject-card:hover .real-img { transform: scale(1.1); filter: brightness(1.1); }

        /* منطقة النص */
        .text-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(to top, #0a0f1f, #0f172a); z-index: 2;
        }
        .sub-name { font-size: 1.1rem; font-weight: 800; color: white; margin-bottom: 2px; }
        .sub-hint { font-size: 0.7rem; color: #94a3b8; }
        .subject-card:hover .sub-hint { color: var(--gold); }

        /* رسائل التحميل والخطأ */
        .loading { grid-column: 1 / -1; text-align: center; color: #94a3b8; font-size: 1rem; margin-top: 50px; }
        .error-msg { 
            grid-column: 1 / -1; 
            text-align: center; 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1); 
            padding: 20px; 
            border-radius: 15px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="stars-container">
        <div class="star" style="top:10%; left:20%; --duration:3s"></div>
        <div class="star" style="top:50%; left:50%; --duration:5s"></div>
        <div class="star" style="top:80%; left:70%; --duration:3s"></div>
    </div>

    <header class="glass-header">
        <div onclick="window.location.href='profile.html'" class="flex items-center gap-3 cursor-pointer group">
            <div class="relative">
                <img src="https://img.freepik.com/free-psd/3d-illustration-person-with-sunglasses_23-2149436188.jpg" 
                     class="w-11 h-11 rounded-full border-2 border-indigo-500 bg-slate-800 p-0.5 group-hover:border-yellow-400 transition">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-black rounded-full"></div>
            </div>
            <div>
                <h2 id="studentNameDisplay" class="font-bold text-sm text-white group-hover:text-yellow-400 transition">...</h2>
                <p class="text-[10px] text-gray-400">الملف الشخصي</p>
            </div>
        </div>
        
        <button onclick="logout()" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center border border-red-500/20 hover:bg-red-500 hover:text-white transition">
            <i class="fas fa-power-off text-sm"></i>
        </button>
    </header>

    <div class="motivation-bar">
        <i class="fas fa-bolt animate-pulse text-yellow-400"></i>
        <span id="quoteText">...</span>
    </div>

    <div class="branding-title">
        <h1 class="branding-text">FULL MARK</h1>
        <p class="text-gray-400 text-xs mt-1 tracking-widest uppercase">مسارك نحو التفوق</p>
    </div>

    <ul id="subjects-list">
        <li class="loading">
            <i class="fas fa-rocket fa-bounce mb-3 text-2xl text-indigo-500"></i><br>
            جاري تجهيز المواد يا بطل...
        </li>
    </ul>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD1QB3qaFfkGYq0OWOEAr83V25NAPFwxzs",
            authDomain: "fullmark-2025.firebaseapp.com",
            databaseURL: "https://fullmark-2025-default-rtdb.firebaseio.com",
            projectId: "fullmark-2025",
            storageBucket: "fullmark-2025.firebasestorage.app",
            messagingSenderId: "963956202032",
            appId: "1:963956202032:web:4df914457d79b75dee2bf5"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Quotes
        const quotes = [
            "🚀 ابدأ الآن ولا تؤجل!", "💪 التعب يزول والإنجاز يبقى", "🏆 أنت بطل قصتك", 
            "🔥 كل دقيقة تفرق في مستقبلك", "💎 حلمك يستاهل", "🌟 ركز على هدفك", 
            "🦁 كن قوياً لأجل نفسك", "⚡ النجاح قرار مش صدفة", "🎓 تخيل لحظة التخرج"
        ];
        let qIndex = 0;
        const qEl = document.getElementById('quoteText');
        if(qEl) {
            qEl.innerText = quotes[0];
            setInterval(() => {
                qIndex = (qIndex + 1) % quotes.length;
                qEl.innerText = quotes[qIndex];
            }, 5000);
        }

        // 3. Images & URLs
        const subjectImages = {
            "أحياء": "https://i.ibb.co/3WqqJk8/bio.jpg",
            "فيزياء": "https://i.ibb.co/y4qQJk8/physics.jpg",
            "كيمياء": "https://i.ibb.co/xXj11k8/chem.jpg",
            "لغة عربية": "https://i.ibb.co/9hQ6z5y/arabic.jpg",
            "English": "https://i.ibb.co/6rQ6z5y/english.jpg",
            "جيولوجيا": "https://images.unsplash.com/photo-1599309328828-92285127096b?w=400&q=80",
            "الرياضيات": "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400&q=80",
            "تاريخ": "https://images.unsplash.com/photo-1568684333877-4d39f2c871c9?w=400&q=80",
            "جغرافيا": "https://images.unsplash.com/photo-1524661135-423995f22d0b?w=400&q=80",
            "الإحصاء": "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&q=80",
            "Le français": "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&q=80"
        };
        
        const JSON_URLS = {
            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json",
            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json", 
            'أزهر': "https://plus-teal.vercel.app/organized_output.json",
            'الافتراضي': "https://plus-teal.vercel.app/organized_output.json"
        };

        // 4. Main Logic
        const activeCode = localStorage.getItem('alpha_user_code') || localStorage.getItem('activeCode');
        
        if (!activeCode) {
            window.location.href = 'index.html'; 
        } else {
            // Get Student Name (معالجة سريعة لاسم الطالب)
            db.ref(`approvedStudents/${activeCode}`).once('value').then(snapshot => {
                const data = snapshot.val();
                if (data && data.studentName) {
                    document.getElementById('studentNameDisplay').innerText = data.studentName;
                } else {
                    document.getElementById('studentNameDisplay').innerText = "طالب مميز";
                }
            }).catch(() => {
                document.getElementById('studentNameDisplay').innerText = "طالب مميز";
            });
        }

        // 🚀 الدالة الذكية لجلب الرابط (مع نظام الطوارئ Timeout)
        async function getDataSourceURL() {
            // لو مفيش كود، رجع الافتراضي فوراً
            if (!activeCode) return JSON_URLS['الافتراضي'];

            // إنشاء وعد (Promise) ينتهي بعد 3 ثواني لو قاعدة البيانات مردتش
            const timeout = new Promise((resolve) => {
                setTimeout(() => resolve("TIMEOUT"), 3000);
            });

            // جلب بيانات الطالب من فايربيس
            const fetchStudentData = db.ref(`approvedStudents/${activeCode}`).once('value').then(snap => snap.val());

            try {
                // سباق بين فايربيس والعداد (أيهما يسبق)
                const result = await Promise.race([fetchStudentData, timeout]);

                if (result === "TIMEOUT") {
                    console.warn("تأخر الاتصال بقاعدة البيانات، جاري استخدام الرابط الافتراضي");
                    return JSON_URLS['الافتراضي']; // تشغيل الطوارئ
                }

                if (result && result.section) {
                    const sec = result.section.trim();
                    return JSON_URLS[sec] || JSON_URLS['الافتراضي'];
                }

                return JSON_URLS['الافتراضي'];

            } catch (error) {
                console.error("خطأ في الاتصال:", error);
                return JSON_URLS['الافتراضي']; // تشغيل الطوارئ في حالة الخطأ
            }
        }

        async function loadSubjects() {
            const subjectsList = document.getElementById('subjects-list');
            
            try {
                // 1. تحديد الرابط (بذكاء)
                const finalSourceURL = await getDataSourceURL();
                console.log("Loading from:", finalSourceURL);

                // 2. جلب ملف المواد
                const res = await fetch(finalSourceURL);
                if (!res.ok) throw new Error("فشل في تحميل ملف المواد");
                const data = await res.json();

                // 3. البحث عن الصف الثالث
                const year = data.find(y => y.id == 3 || y.name == "3");

                if (!year) {
                    subjectsList.innerHTML = `<li class="error-msg">⚠️ لم يتم العثور على مواد الصف الثالث</li>`;
                    return;
                }

                subjectsList.innerHTML = ""; // مسح التحميل

                // 4. عرض المواد
                if (!year.subjects || year.subjects.length === 0) {
                     subjectsList.innerHTML = `<li class="error-msg">⚠️ القائمة فارغة حالياً</li>`;
                     return;
                }

                year.subjects.forEach(subject => {
                    const li = document.createElement("li");
                    li.className = "subject-card group";
                    const imgSrc = subjectImages[subject.name] || "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400&q=80";
                    
                    li.innerHTML = `
                        <div class="img-area">
                            <img src="${imgSrc}" class="real-img" loading="lazy">
                        </div>
                        <div class="text-area">
                            <h3 class="sub-name">${subject.name}</h3>
                            <p class="sub-hint">اضغط للدخول</p>
                        </div>
                    `;

                    li.onclick = () => {
                        window.location.href = `teachers.html?yid=${year.id}&sid=${subject.id}`;
                    };
                    subjectsList.appendChild(li);
                });

            } catch (err) {
                console.error(err);
                subjectsList.innerHTML = `
                    <li class="error-msg">
                        <i class="fas fa-wifi text-2xl mb-2"></i><br>
                        تأكد من اتصال الإنترنت<br>
                        <button onclick="location.reload()" style="margin-top:10px; background:rgba(255,255,255,0.1); padding:5px 15px; border-radius:10px;">إعادة المحاولة</button>
                    </li>
                `;
            }
        }

        function logout() {
            if(confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('alpha_user_code');
                localStorage.removeItem('activeCode');
                window.location.replace('index.html');
            }
        }

        loadSubjects();
    </script>
</body>
</html>
