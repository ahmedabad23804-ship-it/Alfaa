<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية | FULL MARK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            background: #000; 
            color: white; 
            font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* خلفية متحركة */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 10%, #1e1b4b, #000000 80%);
        }

        /* الهيدر */
        .glass-header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 50;
        }

        /* كارت المادة الجديد */
        .subject-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .subject-card:hover {
            transform: translateY(-10px);
            background: rgba(30, 41, 59, 0.7);
            border-color: #6366f1;
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.3);
        }

        /* حاوية الصورة الواقعية */
        .image-container {
            width: 100%;
            height: 140px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .real-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: 0.5s;
            filter: brightness(0.8);
        }
        
        .subject-card:hover .real-img {
            transform: scale(1.1);
            filter: brightness(1);
        }

        .teacher-count {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            padding: 4px 10px; border-radius: 8px;
            font-size: 0.7rem; font-weight: bold; color: #fbbf24;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* تأثير التحميل */
        .skeleton { background: rgba(255,255,255,0.05); animation: pulse 1.5s infinite; border-radius: 24px; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="animated-bg"></div>

    <div id="app">
        
        <header class="glass-header px-6 py-4 flex justify-between items-center">
            <div @click="goToProfile" class="flex items-center gap-3 cursor-pointer group">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full p-[2px] bg-gradient-to-tr from-indigo-500 to-fuchsia-500">
                        <img src="https://img.freepik.com/free-psd/3d-illustration-person-with-sunglasses_23-2149436188.jpg" 
                             class="w-full h-full rounded-full object-cover bg-slate-900">
                    </div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full animate-pulse"></div>
                </div>
                <div>
                    <p class="text-[10px] text-indigo-400 font-bold uppercase">أهلاً بك 👋</p>
                    <h2 class="font-bold text-lg leading-tight group-hover:text-indigo-300 transition">{{ studentName }}</h2>
                </div>
            </div>

            <button onclick="logout()" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center border border-red-500/20 hover:bg-red-500 hover:text-white transition shadow-lg">
                <i class="fas fa-power-off text-sm"></i>
            </button>
        </header>

        <main class="px-6 py-8 max-w-6xl mx-auto">
            
            <div class="mb-8">
                <h1 class="text-2xl font-black mb-1">المواد الدراسية</h1>
                <p class="text-gray-400 text-sm">اختر المادة للوصول للمحتوى</p>
            </div>

            <div v-if="loading" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <div v-for="n in 4" class="h-64 skeleton"></div>
            </div>

            <div v-else class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <div v-for="s in subjects" :key="s.id" @click="openSubject(s)" class="subject-card group">
                    
                    <div class="image-container">
                        <img :src="getImage(s.name)" class="real-img" loading="lazy">
                        <div class="teacher-count">
                            <i class="fas fa-user-tie ml-1"></i> {{ s.teachers ? s.teachers.length : 0 }}
                        </div>
                    </div>
                    
                    <h3 class="text-lg font-bold group-hover:text-indigo-400 transition">{{ s.name }}</h3>
                    <p class="text-xs text-gray-500 mt-1">اضغط للدخول</p>
                </div>
            </div>

            <div v-if="!loading && subjects.length === 0" class="text-center py-20">
                <p class="text-gray-500">لا توجد مواد متاحة حالياً</p>
            </div>

        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const subjects = ref([]);
                const studentName = ref('...');
                const loading = ref(true);
                const yid = ref(null);

                const goToProfile = () => {
                    window.location.href = 'profile.html';
                };

                const openSubject = (s) => {
                    window.location.href = `teachers.html?yid=${yid.value}&sid=${s.id}`;
                };

                // دالة الصور الواقعية (Unsplash)
                const getImage = (name) => {
                    const n = name.toLowerCase();
                    if(n.includes('physics') || n.includes('فيزياء')) return 'https://images.unsplash.com/photo-1636466497217-26a8cbeaf0aa?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('chemistry') || n.includes('كيمياء')) return 'https://images.unsplash.com/photo-1532094349884-543bc11b234d?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('bio') || n.includes('أحياء')) return 'https://images.unsplash.com/photo-1576086213369-97a306d36557?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('history') || n.includes('تاريخ')) return 'https://images.unsplash.com/photo-1568684333877-4d39f2c871c9?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('geo') || n.includes('جغرافيا')) return 'https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('english') || n.includes('إنجليزي')) return 'https://images.unsplash.com/photo-1526304640152-d4619684e484?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('arabic') || n.includes('عربي')) return 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('math') || n.includes('رياضيات')) return 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?q=80&w=400&auto=format&fit=crop';
                    if(n.includes('french') || n.includes('فرنساوي')) return 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=400&auto=format&fit=crop';
                    
                    return 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop'; // Default
                };

                onMounted(async () => {
                    const code = checkAuth();
                    if(!code) return;

                    const db = firebase.database();
                    try {
                        const snap = await db.ref('approvedStudents/'+code).once('value');
                        const user = snap.val();
                        if(user) studentName.value = user.studentName;

                        const URLS = { 
                            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json", 
                            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
                            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json",
                            'أزهر': "https://plus-teal.vercel.app/organized_output.json"
                        };

                        const res = await fetch(URLS[user.section] || URLS['علمي علوم']);
                        const data = await res.json();
                        const year = data.find(y => y.id == 3) || data[0];
                        
                        yid.value = year.id;
                        subjects.value = year.subjects || [];
                    } catch(e) { console.error(e); } 
                    finally { loading.value = false; }
                });

                return { subjects, studentName, loading, getImage, openSubject, goToProfile };
            }
        }).mount('#app');

        function logout() {
            if(confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('alpha_user_code');
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
