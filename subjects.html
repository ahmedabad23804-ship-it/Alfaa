<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية | FULL MARK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* إعدادات الخلفية والألوان بناءً على الصور */
        body { 
            background: #050a18; /* كحلي غامق جداً */
            color: white; 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh; 
            padding-bottom: 80px; 
            overflow-x: hidden; 
        }

        /* تأثير الإضاءة الخلفية */
        .bg-glow { 
            position: fixed; top: -20%; left: 50%; transform: translateX(-50%); 
            width: 150%; height: 600px; 
            background: radial-gradient(circle, rgba(60, 40, 160, 0.25) 0%, transparent 70%); 
            z-index: -1; pointer-events: none;
        }

        /* الهيدر الجديد */
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 25px;
            margin-bottom: 10px;
        }

        /* أزرار الهيدر (الطاقة والتاج) */
        .icon-btn {
            width: 50px; height: 50px;
            border-radius: 18px;
            background: #111526;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #5b6a8e;
            transition: 0.3s; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .icon-btn.power:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
        .icon-btn.crown:hover { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: #fbbf24; }

        /* منطقة البروفايل */
        .profile-area {
            display: flex; align-items: center; gap: 12px;
            background: #111526; padding: 6px 15px 6px 6px;
            border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .p-img-box {
            width: 45px; height: 45px; border-radius: 50%;
            border: 2px solid #6366f1; padding: 2px; position: relative;
        }
        .p-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #0f172a; }
        .p-status {
            position: absolute; bottom: 0; right: 0; width: 12px; height: 12px;
            background: #22c55e; border: 2px solid #111526; border-radius: 50%;
        }

        /* العناوين */
        .main-title {
            text-align: center; margin-bottom: 40px;
        }
        .title-text {
            font-size: 2.2rem; font-weight: 900; color: #a5b4fc;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3); letter-spacing: 1px;
        }
        .subtitle-text {
            color: #64748b; font-size: 0.9rem; font-weight: 700;
            margin-top: -5px; position: relative; display: inline-block;
        }
        .subtitle-text::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 3px; background: #6366f1; border-radius: 2px;
        }

        /* كروت المواد (التصميم الجديد) */
        .subject-card {
            background: #10152a; /* لون الكارت الغامق */
            border-radius: 35px;
            padding: 25px;
            text-align: center;
            height: 280px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; overflow: hidden;
        }
        
        .subject-card:hover {
            transform: translateY(-10px);
            border-color: #3b4566;
            background: #151b33;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        /* صورة المادة */
        .s-img-container {
            width: 130px; height: 130px; margin-bottom: 20px;
            transition: 0.4s;
        }
        .subject-card:hover .s-img-container { transform: scale(1.1) rotate(5deg); }
        .s-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }

        /* اسم المادة */
        .s-name { font-size: 1.6rem; font-weight: 800; color: white; margin-bottom: 15px; }

        /* شارة المعلمين */
        .teacher-badge {
            background: #1e2540; color: #94a3b8;
            padding: 8px 18px; border-radius: 15px;
            font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .subject-card:hover .teacher-badge { background: #6366f1; color: white; }

        /* التحميل */
        .skeleton { background: #111526; border-radius: 35px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        /* الحقوق */
        .footer-brand {
            position: fixed; bottom: 20px; left: 0; w-full; text-align: center; width: 100%;
            font-size: 0.7rem; font-weight: 900; letter-spacing: 3px; color: #334155;
            text-transform: uppercase; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="app">
        
        <header class="header-container">
            <div class="flex gap-3">
                <div @click="logout" class="icon-btn power"><i class="fas fa-power-off"></i></div>
                <a href="profile.html" class="icon-btn crown"><i class="fas fa-crown"></i></a>
            </div>

            <div class="profile-area">
                <div class="text-right">
                    <h2 class="text-white font-bold text-sm leading-tight" id="sName">...</h2>
                    <p class="text-[10px] text-indigo-400 font-bold">بطل الثانوية 🎓</p>
                </div>
                <div class="p-img-box">
                    <img src="https://img.freepik.com/free-psd/3d-illustration-person-with-sunglasses_23-2149436188.jpg" class="p-img">
                    <div class="p-status"></div>
                </div>
            </div>
        </header>

        <div class="main-title">
            <h1 class="title-text">نظام FULL MARK</h1>
            <p class="subtitle-text">مسارك للتفوق</p>
        </div>

        <div class="px-6 pb-20 max-w-7xl mx-auto">
            
            <div v-if="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div v-for="i in 3" class="skeleton h-[280px]"></div>
            </div>

            <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div v-for="s in subjects" :key="s.id" @click="go(s)" class="subject-card group">
                    
                    <div class="s-img-container">
                        <img :src="getImg(s.name)" class="s-img">
                    </div>

                    <h3 class="s-name">{{ s.name }}</h3>

                    <div class="teacher-badge">
                        <i class="fas fa-chalkboard-user"></i>
                        <span>{{ s.teachers ? s.teachers.length : 0 }} معلمين</span>
                    </div>

                </div>
            </div>

            <div v-if="!loading && subjects.length === 0" class="text-center py-20 opacity-50">
                <i class="fas fa-box-open text-4xl mb-2"></i>
                <p>لا توجد مواد متاحة حالياً</p>
            </div>

        </div>

        <div class="footer-brand">ELGIZAWY • DEVELOPMENT</div>
    </div>

    <script>
        // قاعدة بيانات الصور (نفس الصور 3D اللي في التصميم)
        const IMAGES_DB = {
            "فيزياء": "https://cdn3d.iconscout.com/3d/premium/thumb/physics-7265691-5840333.png",
            "كيمياء": "https://cdn3d.iconscout.com/3d/premium/thumb/chemistry-atoms-5691557-4740112.png",
            "أحياء": "https://cdn3d.iconscout.com/3d/premium/thumb/dna-5256241-4385108.png",
            "لغة عربية": "https://cdn3d.iconscout.com/3d/premium/thumb/ramadan-quran-5136006-4286786.png",
            "English": "https://cdn3d.iconscout.com/3d/premium/thumb/english-book-10041135-8135359.png",
            "رياضيات": "https://cdn3d.iconscout.com/3d/premium/thumb/mathematics-9173295-7489437.png",
            "تاريخ": "https://cdn3d.iconscout.com/3d/premium/thumb/pharaoh-6450376-5310636.png",
            "جغرافيا": "https://cdn3d.iconscout.com/3d/premium/thumb/earth-5134701-4282715.png",
            "فرنساوي": "https://cdn3d.iconscout.com/3d/premium/thumb/eiffel-tower-4034026-3337299.png",
            "جيولوجيا": "https://cdn3d.iconscout.com/3d/premium/thumb/mountain-4940523-4116498.png",
            "default": "https://cdn3d.iconscout.com/3d/premium/thumb/education-4940505-4116480.png"
        };

        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const subjects = ref([]);
                const loading = ref(true);
                const yid = ref(null);

                const getImg = (n) => {
                    for(let key in IMAGES_DB) if(n.toLowerCase().includes(key.toLowerCase())) return IMAGES_DB[key];
                    return IMAGES_DB['default'];
                };

                const logout = () => { 
                    if(confirm("هل تريد تسجيل الخروج؟")) {
                        localStorage.removeItem('alpha_user_code'); 
                        window.location.href = 'index.html'; 
                    }
                };

                const go = (s) => {
                    // الانتقال لصفحة المدرسين مع تمرير البيانات
                    window.location.href = `teachers.html?yid=${yid.value}&sid=${s.id}`;
                };

                onMounted(async () => {
                    // التحقق من الأمان (من ملف auth.js)
                    const code = checkAuth();
                    if(!code) return;

                    const db = firebase.database();
                    try {
                        // 1. جلب بيانات الطالب
                        const userSnap = await db.ref('approvedStudents/'+code).once('value');
                        const user = userSnap.val();
                        if(user) document.getElementById('sName').innerText = user.studentName;

                        // 2. جلب المواد بناءً على الشعبة
                        const URLS = { 
                            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json", 
                            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
                            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json",
                            'أزهر': "https://plus-teal.vercel.app/organized_output.json"
                        };

                        const targetURL = URLS[user.section] || URLS['علمي علوم'];
                        const res = await fetch(targetURL);
                        const data = await res.json();
                        
                        // الوصول للصف الثالث الثانوي (ID: 3)
                        let year = data.find(y => y.id == 3) || data[0];
                        yid.value = year.id;
                        subjects.value = year.subjects || [];

                    } catch (e) { 
                        console.error("Error fetching data:", e);
                        alert("حدث خطأ في تحميل المواد، تأكد من الاتصال بالإنترنت");
                    } finally { 
                        loading.value = false; 
                    }
                });

                return { subjects, loading, getImg, logout, go };
            }
        }).mount('#app');
    </script>
</body>
</html>
