<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد | FULL MARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; min-height: 100vh; overflow-x: hidden; }
        
        /* خلفية نيون خفيفة */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 0%, #172554, #020617 70%);
        }

        /* شريط الجمل المتحركة */
        .quote-bar {
            background: rgba(30, 58, 138, 0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .quote-text {
            font-size: 0.9rem; font-weight: bold; color: #fbbf24;
            transition: opacity 0.5s;
        }

        /* كارت المادة (تصميم الأزرار القوي) */
        .subject-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            height: 180px; /* ارتفاع ثابت */
            display: flex; flex-direction: column;
        }

        .subject-btn:active { transform: scale(0.97); }

        /* الصورة الواقعية */
        .img-part {
            height: 110px; width: 100%;
            overflow: hidden; position: relative;
        }
        .real-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.8); transition: 0.5s;
        }
        .subject-btn:hover .real-img { transform: scale(1.1); filter: brightness(1); }

        /* النصوص */
        .text-part {
            padding: 10px; text-align: center;
            display: flex; flex-direction: column; justify-content: center; flex: 1;
        }
        .sub-name { font-size: 1.1rem; font-weight: 800; color: white; }
        .sub-info { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }

        /* عدد المدرسين */
        .badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.7); color: #fbbf24;
            padding: 3px 8px; border-radius: 6px;
            font-size: 0.65rem; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="app">
        <div class="flex justify-between items-center p-5">
            <div @click="goToProfile" class="flex items-center gap-3 cursor-pointer">
                <div class="relative">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-12 h-12 rounded-full border-2 border-indigo-500 bg-slate-800 p-1">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-black rounded-full"></div>
                </div>
                <div>
                    <h2 class="font-bold text-white">{{ studentName }}</h2>
                    <p class="text-[10px] text-gray-400">الملف الشخصي</p>
                </div>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center">
                <i class="fas fa-power-off"></i>
            </button>
        </div>

        <div class="quote-bar">
            <div class="flex justify-center items-center gap-2">
                <i class="fas fa-fire text-orange-500 animate-pulse"></i>
                <span id="quoteDisplay" class="quote-text">...</span>
            </div>
        </div>

        <div class="px-5 pb-20 max-w-4xl mx-auto">
            <div v-if="loading" class="text-center mt-20 text-gray-500">جاري تحميل المواد...</div>

            <div v-else class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div v-for="s in subjects" :key="s.id" @click="openSubject(s)" class="subject-btn group">
                    <div class="img-part">
                        <img :src="getImage(s.name)" class="real-img" loading="lazy">
                        <div class="badge"><i class="fas fa-user"></i> {{ s.teachers ? s.teachers.length : 0 }}</div>
                    </div>
                    <div class="text-part">
                        <h3 class="sub-name">{{ s.name }}</h3>
                        <p class="sub-info">اضغط للدخول</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quotes = [
            "لا تتوقف عندما تتعب، توقف عندما تنتهي 💪",
            "حلمك يستحق المحاولة 🚀",
            "اصنع مستقبلك الآن ✨",
            "ألم الدراسة لحظة، وألم الفشل حياة ⏳",
            "أنت بطل قصتك 🦁",
            "كل مجهود بتبذله النهاردة هترتاح بسببه بكرة 💎",
            "النجاح بيحب المجتهدين 🏆",
            "ركز على هدفك وانسى أي حاجة تانية 🎯",
            "صدقني هتوصل، بس كمل مشي 🚶‍♂️",
            "خليك طماع في النجاح 🥇"
            // (يمكنك إضافة الـ 40 جملة الباقية هنا)
        ];

        // تشغيل الجمل فوراً
        let qIdx = 0;
        const qEl = document.getElementById('quoteDisplay');
        if(qEl) {
            qEl.innerText = quotes[0]; // عرض أول جملة فوراً
            setInterval(() => {
                qEl.style.opacity = 0;
                setTimeout(() => {
                    qIdx = (qIdx + 1) % quotes.length;
                    qEl.innerText = quotes[qIdx];
                    qEl.style.opacity = 1;
                }, 500);
            }, 5000);
        }

        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const subjects = ref([]);
                const studentName = ref('...');
                const loading = ref(true);
                const yid = ref(null);

                const goToProfile = () => window.location.href = 'profile.html';
                const openSubject = (s) => window.location.href = `teachers.html?yid=${yid.value}&sid=${s.id}`;

                // روابط صور ثابتة (Fallback) لضمان الظهور
                const getImage = (name) => {
                    const n = name.toLowerCase();
                    if(n.includes('english') || n.includes('انجليزى') || n.includes('إنجليزي')) 
                        return 'https://i.ibb.co/6rQ6z5y/english.jpg'; // صورة كتب
                    if(n.includes('physics') || n.includes('فيزياء')) 
                        return 'https://i.ibb.co/y4qQJk8/physics.jpg'; // صورة فيزياء
                    if(n.includes('chemistry') || n.includes('كيمياء')) 
                        return 'https://i.ibb.co/xXj11k8/chem.jpg'; // صورة كيمياء
                    if(n.includes('bio') || n.includes('أحياء')) 
                        return 'https://i.ibb.co/3WqqJk8/bio.jpg'; // صورة أحياء
                    if(n.includes('arabic') || n.includes('عربي')) 
                        return 'https://i.ibb.co/9hQ6z5y/arabic.jpg'; // صورة عربي
                    
                    // صورة افتراضية لو مفيش تطابق
                    return 'https://i.ibb.co/jvQ6z5y/default.jpg';
                };

                onMounted(async () => {
                    const code = checkAuth();
                    if(!code) return;
                    const db = firebase.database();
                    try {
                        const snap = await db.ref('approvedStudents/'+code).once('value');
                        const user = snap.val();
                        if(user) studentName.value = user.studentName;

                        const URLS = { 
                            'علمي علوم': "https://plus-teal.vercel.app/organized_output.json", 
                            'أدبي': "https://plus-teal.vercel.app/organized_output-a.json", 
                            'علمي رياضة': "https://platform-sigma-seven.vercel.app/organized_output-e.json",
                            'أزهر': "https://plus-teal.vercel.app/organized_output.json"
                        };
                        const res = await fetch(URLS[user.section] || URLS['علمي علوم']);
                        const data = await res.json();
                        const year = data.find(y => y.id == 3) || data[0];
                        yid.value = year.id;
                        subjects.value = year.subjects || [];
                    } catch(e) { console.error(e); } 
                    finally { loading.value = false; }
                });

                return { subjects, studentName, loading, getImage, openSubject, goToProfile };
            }
        }).mount('#app');

        function logout() {
            if(confirm('خروج؟')) {
                localStorage.removeItem('alpha_user_code');
                window.location.replace('index.html');
            }
        }
    </script>
</body>
        </html>
