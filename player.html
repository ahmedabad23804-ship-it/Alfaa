<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; }
        
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* تنسيق زر التشغيل الأحمر */
        :root { --plyr-color-main: #ff0000; }
        
        /* زر التشغيل الكبير */
        .plyr__control--overlaid {
            background: rgba(0, 0, 0, 0.7) !important;
            color: white !important;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 30px !important;
            border-radius: 50% !important;
            display: flex !important; /* ضمان ظهوره */
        }
        .plyr__control--overlaid:hover {
            background: #ff0000 !important; border-color: #ff0000 !important;
        }
        .plyr__control--overlaid svg { width: 45px !important; height: 45px !important; }

        /* الهيدر */
        .video-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; display: flex; align-items: center; gap: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 50; pointer-events: none;
            opacity: 0; transition: 0.3s;
        }
        .plyr--show-controls .video-header { opacity: 1; }

        .back-button {
            pointer-events: auto; color: white; width: 40px; height: 40px;
            background: rgba(255,255,255,0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px);
        }

        .video-title {
            color: white; font-size: 1rem; font-weight: bold;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%;
        }

        /* العلامة المائية */
        .watermark {
            position: absolute; bottom: 80px; right: 20px;
            font-size: 1rem; color: rgba(255,255,255,0.25);
            font-weight: 900; pointer-events: none; z-index: 40;
            animation: moveRandom 20s infinite alternate linear;
        }
        @keyframes moveRandom {
            0% { top: 10%; left: 10%; } 100% { top: 80%; left: 80%; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper">
        <div class="video-header">
            <button onclick="history.back()" class="back-button"><i class="fas fa-arrow-right"></i></button>
            <h1 class="video-title" id="vidTitle">جار التحميل...</h1>
        </div>

        <video id="player" playsinline controls class="w-full h-full" style="max-height: 100vh;">
            </video>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. التحقق
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        
        const stdName = localStorage.getItem('studentName') || "";
        const shortName = stdName.split(' ').slice(0, 2).join(' ');
        document.getElementById('watermark').innerText = userCode + (shortName ? " • " + shortName : "");

        // 2. استرجاع البيانات
        let videoData;
        try {
            videoData = JSON.parse(localStorage.getItem('activeLecture'));
        } catch(e) { console.error(e); }

        if(!videoData) { alert("بيانات الفيديو غير موجودة"); history.back(); }

        const title = videoData.video_name || videoData.name || videoData.title || "مشاهدة الفيديو";
        document.getElementById('vidTitle').innerText = title;

        let src = videoData.stream_url || videoData.video_url || "";
        src = src.trim();

        // 3. تركيب الفيديو (تركيز على الملفات)
        const videoElement = document.getElementById('player');
        
        // التحقق من الرابط
        if (!src) {
            alert("رابط الفيديو فارغ!");
        } else {
            // وضع الرابط مباشرة
            videoElement.src = src;
            
            // إضافة مستمع للأخطاء (عشان لو الرابط بايظ نعرف)
            videoElement.addEventListener('error', function(e) {
                console.error("Error loading video:", e);
                alert("تعذر تشغيل الملف. تأكد من اتصالك بالإنترنت أو أن الرابط صحيح.");
            });
        }

        // 4. تشغيل Plyr
        const player = new Plyr(videoElement, {
            controls: [
                'play-large', // الزر الكبير
                'play', 
                'progress', 
                'current-time', 
                'duration', 
                'mute', 
                'volume', 
                'settings', 
                'fullscreen'
            ],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 2] },
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' },
            clickToPlay: true,
            hideControls: true,
            resetOnEnd: true,
        });

        // إصلاح مشكلة الحجم
        player.on('ready', () => {
            // التأكد إن الفيديو واخد راحته في الشاشة
            document.querySelector('.plyr').style.height = '100%';
            document.querySelector('.plyr').style.width = '100%';
        });

    </script>
</body>
</html>
