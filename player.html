<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* الحاوية الرئيسية */
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* تعديلات Plyr */
        .plyr--full-ui input[type=range] { color: #ff0000 !important; }
        .plyr__control--overlaid { display: none !important; } /* إخفاء زر التشغيل الأصلي */
        
        /* شريط التحكم السفلي (التايم لاين وزر التكبير) */
        .plyr__controls {
            z-index: 1000 !important; /* لازم يكون أعلى حاجة عشان ينداس عليه */
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent) !important;
            padding-bottom: 25px !important;
            padding-top: 50px !important;
        }

        /* ==================== طبقة الأزرار العائمة (YouTube Style) ==================== */
        .yt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; /* فوق الفيديو بس تحت شريط التحكم */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
            
            /* 🔥 السحر هنا: الطبقة دي شفافة للمسات ماعدا الأزرار */
            /* ده عشان لما تدوس في الفاضي الفيديو يظهر ويختفي، ولما تدوس عالزرار يشتغل */
            pointer-events: none; 
        }

        /* السماح بالضغط على الأزرار فقط */
        .yt-btn-container { pointer-events: auto; display: flex; align-items: center; gap: 40px; margin-bottom: 50px; }

        .yt-btn-circle {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; border: none;
            backdrop-filter: blur(4px); transition: 0.2s;
        }
        .yt-btn-circle:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }

        .yt-play-big {
            width: 75px; height: 75px; font-size: 2.2rem;
            background: rgba(0, 0, 0, 0.7);
        }

        /* الهيدر العلوي (اسم الفيديو) */
        .yt-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto; /* قابل للنقر */
        }

        /* مناطق الدبل تاب (مفصولة عن زر التكبير) */
        .dt-zone {
            position: absolute; top: 20%; bottom: 25%; /* 🔥 سايبين مساحة تحت لزر التكبير */
            width: 35%; z-index: 60; pointer-events: auto;
        }
        .dt-left { left: 0; }
        .dt-right { right: 0; }

        /* أنميشن الدبل تاب */
        .ripple-icon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
            opacity: 0; transition: 0.3s;
        }
        .show-ripple { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

        /* كلاس للإخفاء */
        .hidden-ui { opacity: 0; pointer-events: none !important; }
        
        .watermark {
            position: absolute; bottom: 80px; right: 20px;
            font-size: 0.9rem; color: rgba(255,255,255,0.3);
            font-weight: bold; pointer-events: none; z-index: 1001;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper" id="videoWrapper">
        <div id="player-container" class="w-full h-full"></div>

        <div id="ytOverlay" class="yt-overlay">
            
            <div class="yt-header">
                <div class="flex items-center gap-3">
                    <button onclick="history.back()" class="text-white text-xl p-2"><i class="fas fa-arrow-right"></i></button>
                    <h1 class="text-white text-sm font-bold truncate max-w-[200px]" id="vidTitle">...</h1>
                </div>
            </div>

            <div class="yt-btn-container">
                <button id="btnRewind" class="yt-btn-circle">
                    <i class="fas fa-undo-alt text-sm"></i><span class="text-[9px] absolute mt-5 font-bold">10</span>
                </button>

                <button id="btnPlayPause" class="yt-btn-circle yt-play-big">
                    <i class="fas fa-play ml-1" id="iconPlay"></i>
                </button>

                <button id="btnForward" class="yt-btn-circle">
                    <i class="fas fa-redo-alt text-sm"></i><span class="text-[9px] absolute mt-5 font-bold">10</span>
                </button>
            </div>
        </div>

        <div id="zoneLeft" class="dt-zone dt-left"><div class="ripple-icon" id="ripLeft"><i class="fas fa-backward"></i><span class="text-xs">10s</span></div></div>
        <div id="zoneRight" class="dt-zone dt-right"><div class="ripple-icon" id="ripRight"><i class="fas fa-forward"></i><span class="text-xs">10s</span></div></div>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = "ID: " + userCode;

        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        if(!videoData) { alert("خطأ"); history.back(); }
        document.getElementById('vidTitle').innerText = videoData.video_name || "فيديو";

        const container = document.getElementById('player-container');
        let src = videoData.stream_url || "";

        if(src.includes('youtube') || src.includes('youtu.be')) {
            let vidId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
            container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${vidId}"></div>`;
        } else {
            container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
        }

        const player = new Plyr('#player', {
            controls: ['progress', 'current-time', 'duration', 'settings', 'fullscreen'],
            hideControls: false,
            clickToPlay: false,
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' }
        });

        // UI Logic
        const overlay = document.getElementById('ytOverlay');
        const iconPlay = document.getElementById('iconPlay');
        let uiTimer;

        function showUI() {
            overlay.classList.remove('hidden-ui');
            player.toggleControls(true);
            clearTimeout(uiTimer);
            if(player.playing) uiTimer = setTimeout(hideUI, 3000);
        }

        function hideUI() {
            if(player.paused) return;
            overlay.classList.add('hidden-ui');
            player.toggleControls(false);
        }

        function toggleUI() {
            if(overlay.classList.contains('hidden-ui')) showUI();
            else hideUI();
        }

        // Button Events
        document.getElementById('btnPlayPause').addEventListener('click', (e) => {
            e.stopPropagation(); player.togglePlay();
        });
        document.getElementById('btnForward').addEventListener('click', (e) => {
            e.stopPropagation(); player.forward(10); showUI();
        });
        document.getElementById('btnRewind').addEventListener('click', (e) => {
            e.stopPropagation(); player.rewind(10); showUI();
        });

        // Player Events
        player.on('play', () => {
            iconPlay.className = 'fas fa-pause';
            uiTimer = setTimeout(hideUI, 2500);
        });
        player.on('pause', () => {
            iconPlay.className = 'fas fa-play ml-1';
            showUI();
        });

        // Double Tap Logic
        const zoneL = document.getElementById('zoneLeft');
        const zoneR = document.getElementById('zoneRight');
        let lastTap = 0;

        function handleTap(e, type) {
            e.preventDefault(); e.stopPropagation();
            const now = new Date().getTime();
            const diff = now - lastTap;

            if (diff < 300 && diff > 0) {
                // Double Tap
                if(type === 'fwd') {
                    player.forward(10);
                    animRipple('ripRight');
                } else {
                    player.rewind(10);
                    animRipple('ripLeft');
                }
            } else {
                // Single Tap -> Toggle UI
                toggleUI();
            }
            lastTap = now;
        }

        function animRipple(id) {
            const el = document.getElementById(id);
            el.classList.add('show-ripple');
            setTimeout(() => el.classList.remove('show-ripple'), 400);
        }

        zoneR.addEventListener('click', (e) => handleTap(e, 'fwd'));
        zoneL.addEventListener('click', (e) => handleTap(e, 'rew'));

        // لمسة عامة على الشاشة لإظهار التحكم
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) toggleUI();
        });

        showUI();
    </script>
</body>
</html>
