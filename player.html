<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK | المشغل</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #020617; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-user-select: none; }
        
        .video-wrapper {
            width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
        }

        :root {
            --plyr-color-main: #6366f1;
            --plyr-video-background: transparent;
            --plyr-menu-background: rgba(15, 23, 42, 0.95);
            --plyr-menu-color: #f8fafc;
        }

        /* ✅ إصلاح زرار التكبير والتصغير */
        /* 1. رفع شريط التحكم فوق كل الطبقات */
        .plyr__controls {
            z-index: 1000 !important; /* رقم عالي جداً عشان يضمن الظهور */
            position: relative;
        }
        
        /* 2. إجبار زر التكبير على الظهور */
        button[data-plyr="fullscreen"] {
            display: inline-block !important;
        }

        /* زر الرجوع */
        .back-btn {
            position: absolute; top: 20px; right: 20px; z-index: 1100; /* أعلى من الفيديو */
            width: 45px; height: 45px; border-radius: 15px;
            background: rgba(15, 23, 42, 0.6); color: white;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            cursor: pointer; transition: 0.4s;
        }
        .back-btn:hover { background: #6366f1; transform: scale(1.1); }

        .security-watermark {
            position: absolute; font-size: 1.5rem; font-weight: 900;
            color: rgba(255, 255, 255, 0.15); pointer-events: none; z-index: 40;
            white-space: nowrap; animation: floatMove 15s infinite alternate ease-in-out;
        }
        @keyframes floatMove {
            0% { top: 10%; left: 10%; transform: rotate(-5deg); }
            100% { top: 90%; left: 90%; transform: rotate(-5deg); }
        }

        /* مناطق اللمس المزدوج */
        .dt-zone {
            position: absolute; top: 0; 
            bottom: 100px; /* ✅ رفعناها 100 بيكسل عشان نبعد عن شريط التحكم تماماً */
            width: 35%; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.2s; pointer-events: auto;
        }
        .dt-left { left: 0; }
        .dt-right { right: 0; }
        
        .tap-icon { 
            background: rgba(0, 0, 0, 0.7); padding: 25px; border-radius: 50%;
            backdrop-filter: blur(5px); display: flex; flex-direction: column; 
            align-items: center; color: white; transform: scale(0.8);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div onclick="history.back()" class="back-btn"><i class="fas fa-arrow-right"></i></div>
    <div id="watermark" class="security-watermark">Loading ID...</div>

    <div class="video-wrapper">
        <div id="player-container" class="w-full max-w-5xl h-full flex items-center justify-center"></div>

        <div id="tapLeft" class="dt-zone dt-left">
            <div class="tap-icon"><i class="fas fa-backward text-3xl"></i><span class="text-sm font-bold mt-2">10s</span></div>
        </div>
        <div id="tapRight" class="dt-zone dt-right">
            <div class="tap-icon"><i class="fas fa-forward text-3xl"></i><span class="text-sm font-bold mt-2">10s</span></div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const userCode = checkAuth();
        if (!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = userCode;

        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        const container = document.getElementById('player-container');

        if (!videoData) {
            alert("خطأ في الفيديو"); history.back();
        } else {
            let src = videoData.stream_url || videoData.video_url || "";
            // تنظيف الرابط
            src = src.trim();

            if(src.includes('youtube') || src.includes('youtu.be')) {
                let videoId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
                container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${videoId}"></div>`;
            } else {
                container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
            }

            // إعدادات المشغل
            const player = new Plyr('#player', {
                // ✅ ترتيب الأزرار وإضافة زر التكبير fullscreen
                controls: [
                    'play-large', // زر التشغيل الكبير في النص
                    'play', // زر التشغيل الصغير تحت
                    'progress', // شريط الوقت
                    'current-time', // الوقت الحالي
                    'duration', // الوقت الكلي
                    'mute', // كتم الصوت
                    'volume', // مستوى الصوت
                    'settings', // الإعدادات (الجودة والسرعة)
                    'fullscreen' // ✅ زر التكبير والتصغير
                ],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 2] },
                fullscreen: { enabled: true, fallback: true, iosNative: false },
                clickToPlay: true
            });

            // منع التكبير باللمس المزدوج على الشاشة
            document.querySelector('.video-wrapper').addEventListener('dblclick', (e) => {
                e.preventDefault(); e.stopPropagation();
            }, true);

            // تشغيل التقديم والترجيع
            const tapLeft = document.getElementById('tapLeft');
            const tapRight = document.getElementById('tapRight');
            let lastTapTime = 0;

            function handleDoubleTap(e, action) {
                e.stopPropagation(); e.preventDefault();
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    if (action === 'forward') { player.forward(10); animateTap(tapRight); } 
                    else { player.rewind(10); animateTap(tapLeft); }
                } else {
                    player.togglePlay();
                }
                lastTapTime = currentTime;
            }

            function animateTap(element) {
                element.style.opacity = '1';
                setTimeout(() => { element.style.opacity = '0'; }, 400);
            }

            tapRight.addEventListener('click', (e) => handleDoubleTap(e, 'forward'));
            tapLeft.addEventListener('click', (e) => handleDoubleTap(e, 'backward'));
        }
    </script>
</body>
</html>
