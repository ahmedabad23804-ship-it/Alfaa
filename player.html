<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* تعديلات Plyr */
        :root { --plyr-color-main: #ff0000; }
        .plyr__control--overlaid { display: none !important; }
        
        .plyr__controls {
            z-index: 1000 !important;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent) !important;
            padding-bottom: 30px !important;
            padding-top: 60px !important;
        }

        /* طبقة التحكم */
        .yt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; 
            display: flex; flex-direction: column; justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
        }

        /* الهيدر العلوي */
        .yt-header {
            padding: 20px; display: flex; align-items: center; gap: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            transition: 0.3s;
        }

        .header-btn {
            color: white; font-size: 1.2rem; padding: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.1); width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
        }
        .header-btn:hover { background: rgba(255,255,255,0.3); }

        .video-title {
            color: white; font-size: 0.9rem; font-weight: bold;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
        }

        /* زر التشغيل في المنتصف */
        .center-controls {
            display: flex; align-items: center; justify-content: center;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%;
        }

        .yt-play-big {
            width: 80px; height: 80px; font-size: 2.5rem; border-radius: 50%;
            background: rgba(0, 0, 0, 0.7); color: white;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .yt-play-big:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }

        /* 💻 تحسينات للشاشات الكبيرة 💻 */
        @media (min-width: 768px) {
            .yt-play-big { width: 100px; height: 100px; font-size: 3.5rem; }
            .video-title { font-size: 1.3rem; max-width: 80%; }
            .yt-header { padding: 30px; }
            .yt-play-big:hover { background: #ff0000; color: white; border-color: #ff0000; transform: scale(1.1); }
        }

        .watermark {
            position: absolute; bottom: 80px; right: 20px;
            font-size: 0.9rem; color: rgba(255,255,255,0.3);
            font-weight: bold; pointer-events: none; z-index: 5;
            animation: floatText 15s infinite alternate;
        }
        @keyframes floatText { from { transform: translateX(0); } to { transform: translateX(-30px); } }

        .hidden-ui { opacity: 0; pointer-events: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper" id="videoWrapper">
        <div id="player-container" class="w-full h-full"></div>

        <div id="ytOverlay" class="yt-overlay">
            
            <div class="yt-header">
                <button onclick="history.back()" class="header-btn"><i class="fas fa-arrow-right"></i></button>
                <h1 class="video-title" id="vidTitle">...</h1>
            </div>

            <div class="center-controls">
                <button id="btnPlayPause" class="yt-play-big">
                    <i class="fas fa-play ml-1" id="iconPlay"></i>
                </button>
            </div>

            <div style="height: 80px;"></div>
        </div>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = "ID: " + userCode;

        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        if(!videoData) { alert("خطأ"); history.back(); }
        document.getElementById('vidTitle').innerText = videoData.video_name || videoData.name || "مشاهدة الفيديو";

        const container = document.getElementById('player-container');
        let src = videoData.stream_url || videoData.video_url || "";
        src = src.trim();

        if(src.includes('youtube') || src.includes('youtu.be')) {
            let vidId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
            container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${vidId}"></div>`;
        } else {
            container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
        }

        const player = new Plyr('#player', {
            controls: ['progress', 'current-time', 'duration', 'settings', 'fullscreen'],
            hideControls: false,
            clickToPlay: false,
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' }
        });

        const overlay = document.getElementById('ytOverlay');
        const iconPlay = document.getElementById('iconPlay');
        const wrapper = document.getElementById('videoWrapper');
        let uiTimer;

        function showUI() {
            overlay.classList.remove('hidden-ui');
            player.toggleControls(true);
            resetTimer();
        }

        function hideUI() {
            if(player.paused) return;
            overlay.classList.add('hidden-ui');
            player.toggleControls(false);
        }

        function resetTimer() {
            clearTimeout(uiTimer);
            if(player.playing) {
                uiTimer = setTimeout(hideUI, 3000);
            }
        }

        function toggleUI() {
            if(overlay.classList.contains('hidden-ui')) showUI();
            else hideUI();
        }

        // زرار التشغيل الوحيد
        document.getElementById('btnPlayPause').addEventListener('click', (e) => {
            e.stopPropagation(); player.togglePlay();
        });

        // مزامنة الأيقونة
        player.on('play', () => {
            iconPlay.className = 'fas fa-pause';
            resetTimer();
        });
        player.on('pause', () => {
            iconPlay.className = 'fas fa-play ml-1';
            showUI();
        });

        // دعم الماوس (للاب توب)
        wrapper.addEventListener('mousemove', () => {
            if(overlay.classList.contains('hidden-ui')) showUI();
            else resetTimer();
        });

        // لمس الشاشة (للموبايل)
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay || e.target.classList.contains('center-controls')) {
                toggleUI();
            }
        });

        showUI();
    </script>
</body>
</html>
