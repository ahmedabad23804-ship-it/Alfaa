<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK | المشغل</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* إعدادات عامة */
        body, html { margin: 0; padding: 0; height: 100%; background: #020617; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .video-wrapper {
            width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
        }

        /* تخصيص ألوان Plyr */
        :root {
            --plyr-color-main: #6366f1;
            --plyr-video-background: transparent;
            --plyr-menu-background: rgba(15, 23, 42, 0.95);
            --plyr-menu-color: #f8fafc;
        }

        /* 🔥 الإصلاح الجذري: رفع ترتيب أزرار التحكم فوق كل شيء 🔥 */
        .plyr--full-ui .plyr__controls {
            z-index: 9999 !important; /* رقم عالي جداً */
            padding-bottom: 25px !important; /* رفع الشريط قليلاً للأعلى */
        }
        /* إجبار زر التكبير على الظهور */
        .plyr__control--fullscreen { display: inline-block !important; }

        /* زر الرجوع */
        .back-btn {
            position: absolute; top: 30px; right: 30px; z-index: 10000; /* أعلى من الفيديو */
            width: 50px; height: 50px; border-radius: 18px;
            background: rgba(30, 41, 59, 0.7); color: white;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            cursor: pointer; transition: 0.3s;
        }
        .back-btn:hover { background: #6366f1; }

        /* العلامة المائية المتحركة */
        .security-watermark {
            position: absolute; font-size: 1.8rem; font-weight: 900;
            color: rgba(255, 255, 255, 0.1); pointer-events: none; z-index: 50;
            white-space: nowrap; animation: floatMove 18s infinite alternate ease-in-out;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        @keyframes floatMove {
            0% { top: 15%; left: 10%; transform: rotate(-8deg); }
            100% { top: 85%; left: 80%; transform: rotate(8deg); }
        }

        /* 🔥 مناطق اللمس "الآمنة" 🔥 */
        /* التعديل هنا: المناطق دي مش واصلة لتحت عشان متغطيش الزراير */
        .dt-zone {
            position: absolute;
            top: 15%; /* تبدأ من تحت الهيدر */
            height: 65%; /* تنتهي قبل شريط التحكم بمسافة كبيرة */
            width: 35%; /* العرض */
            z-index: 100; /* تحت شريط التحكم */
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.2s; pointer-events: auto;
        }
        .dt-left { left: 0; }
        .dt-right { right: 0; }
        
        .tap-icon { 
            background: rgba(99, 102, 241, 0.8); padding: 25px; border-radius: 50%;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; 
            align-items: center; color: white; transform: scale(0.9);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div onclick="history.back()" class="back-btn"><i class="fas fa-arrow-right text-xl"></i></div>
    <div id="watermark" class="security-watermark">Loading ID...</div>

    <div class="video-wrapper">
        <div id="player-container" class="w-full max-w-6xl h-full flex items-center justify-center px-4"></div>

        <div id="tapLeft" class="dt-zone dt-left">
            <div class="tap-icon"><i class="fas fa-backward text-3xl"></i><span class="text-sm font-black mt-2">10s</span></div>
        </div>
        <div id="tapRight" class="dt-zone dt-right">
            <div class="tap-icon"><i class="fas fa-forward text-3xl"></i><span class="text-sm font-black mt-2">10s</span></div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. التحقق من الكود
        const userCode = checkAuth();
        if (!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = userCode;

        // 2. جلب الفيديو
        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        const container = document.getElementById('player-container');

        if (!videoData) {
            alert("خطأ في تحميل بيانات الفيديو"); history.back();
        } else {
            let src = videoData.stream_url || videoData.video_url || "";
            src = src.trim();

            // تحديد نوع المشغل (يوتيوب أو عادي)
            if(src.includes('youtube') || src.includes('youtu.be')) {
                let videoId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
                container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${videoId}"></div>`;
            } else {
                container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
            }

            // 3. إعدادات Plyr المتقدمة
            const player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'duration', 
                    'mute', 'volume', 'settings', 'fullscreen' // ✅ زر التكبير موجود
                ],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 2] },
                fullscreen: { enabled: true, fallback: true, iosNative: 'auto' }, // إعدادات التكبير
                clickToPlay: true,
                hideControls: true,
                resetOnEnd: true,
                keyboard: { focused: true, global: true }
            });

            // 4. منع التكبير الافتراضي للمتصفح عند اللمس المزدوج
            document.querySelector('.video-wrapper').addEventListener('dblclick', (e) => {
                e.preventDefault(); e.stopPropagation();
            }, { passive: false });

            // 5. منطق التقديم والترجيع باللمس المزدوج
            const tapLeft = document.getElementById('tapLeft');
            const tapRight = document.getElementById('tapRight');
            let lastTapTime = 0;

            function handleDoubleTap(e, action) {
                // منع الحدث من الوصول للمشغل عشان ميعملش Play/Pause
                e.stopPropagation(); e.preventDefault();
                
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    // دبل كليك -> تقديم أو ترجيع
                    if (action === 'forward') { player.forward(10); animateTap(tapRight); } 
                    else { player.rewind(10); animateTap(tapLeft); }
                } else {
                    // كليك واحد -> تشغيل/إيقاف (اختياري، ممكن نلغيه لو حابب)
                    player.togglePlay();
                }
                lastTapTime = currentTime;
            }

            function animateTap(element) {
                element.style.opacity = '1';
                // إخفاء الأيقونة بعد نص ثانية
                setTimeout(() => { element.style.opacity = '0'; }, 500);
            }

            // استخدام 'click' لضمان التوافق
            tapRight.addEventListener('click', (e) => handleDoubleTap(e, 'forward'));
            tapLeft.addEventListener('click', (e) => handleDoubleTap(e, 'backward'));

            // 6. تشغيل الفيديو تلقائياً عند الجاهزية (اختياري)
            player.on('ready', () => {
                player.play().catch(() => {}); // محاولة التشغيل الصامت
            });
        }
    </script>
</body>
</html>
