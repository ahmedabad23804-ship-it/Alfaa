<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* تعديلات Plyr */
        :root { --plyr-color-main: #ff0000; }
        .plyr__control--overlaid { display: none !important; } /* إخفاء زر التشغيل الأصلي */
        
        /* شريط التحكم السفلي */
        .plyr__controls {
            z-index: 1000 !important;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent) !important;
            padding-bottom: 30px !important;
            padding-top: 50px !important;
        }

        /* ==================== طبقة التحكم (الأزرار فقط) ==================== */
        .yt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; 
            display: flex; flex-direction: column; justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
        }

        /* الهيدر العلوي */
        .yt-header {
            padding: 20px; display: flex; align-items: center; gap: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        /* حاوية الأزرار في المنتصف */
        .center-controls {
            display: flex; align-items: center; justify-content: center; gap: 40px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%;
        }

        .yt-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); color: white; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .yt-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }

        .yt-play-big {
            width: 80px; height: 80px; font-size: 2.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* العلامة المائية */
        .watermark {
            position: absolute; bottom: 80px; right: 20px;
            font-size: 0.9rem; color: rgba(255,255,255,0.3);
            font-weight: bold; pointer-events: none; z-index: 5;
            animation: floatText 15s infinite alternate;
        }
        @keyframes floatText { from { transform: translateX(0); } to { transform: translateX(-30px); } }

        /* كلاس الإخفاء */
        .hidden-ui { opacity: 0; pointer-events: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper" id="videoWrapper">
        
        <div id="player-container" class="w-full h-full"></div>

        <div id="ytOverlay" class="yt-overlay">
            
            <div class="yt-header">
                <button onclick="history.back()" class="text-white text-xl p-2 rounded-full hover:bg-white/10 transition"><i class="fas fa-arrow-right"></i></button>
                <h1 class="text-white text-sm font-bold truncate max-w-[70%]" id="vidTitle">...</h1>
            </div>

            <div class="center-controls">
                <button id="btnRewind" class="yt-btn">
                    <i class="fas fa-undo-alt text-sm"></i>
                    <span class="absolute mt-6 text-[10px] font-bold">10</span>
                </button>

                <button id="btnPlayPause" class="yt-btn yt-play-big">
                    <i class="fas fa-play ml-1" id="iconPlay"></i>
                </button>

                <button id="btnForward" class="yt-btn">
                    <i class="fas fa-redo-alt text-sm"></i>
                    <span class="absolute mt-6 text-[10px] font-bold">10</span>
                </button>
            </div>

            <div style="height: 80px;"></div>
        </div>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. التحقق
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = "ID: " + userCode;

        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        if(!videoData) { alert("خطأ"); history.back(); }
        document.getElementById('vidTitle').innerText = videoData.video_name || videoData.name || "مشاهدة الفيديو";

        // 2. إعداد المشغل
        const container = document.getElementById('player-container');
        let src = videoData.stream_url || videoData.video_url || "";
        src = src.trim();

        if(src.includes('youtube') || src.includes('youtu.be')) {
            let vidId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
            container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${vidId}"></div>`;
        } else {
            container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
        }

        const player = new Plyr('#player', {
            controls: ['progress', 'current-time', 'duration', 'settings', 'fullscreen'],
            hideControls: false, // احنا هنتحكم في الإخفاء
            clickToPlay: false, // لغينا اللمس للتشغيل عشان ميتعارضش
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' }
        });

        // 3. منطق التحكم (السهل الممتنع)
        const overlay = document.getElementById('ytOverlay');
        const iconPlay = document.getElementById('iconPlay');
        let uiTimer;

        // دالة إظهار الواجهة
        function showUI() {
            overlay.classList.remove('hidden-ui');
            player.toggleControls(true);
            
            clearTimeout(uiTimer);
            // لو الفيديو شغال، نخفي الواجهة بعد 3 ثواني
            if(player.playing) {
                uiTimer = setTimeout(hideUI, 3000);
            }
        }

        // دالة إخفاء الواجهة
        function hideUI() {
            if(player.paused) return; // لو واقف متخفيش الواجهة
            overlay.classList.add('hidden-ui');
            player.toggleControls(false);
        }

        // 4. تشغيل الأزرار
        document.getElementById('btnPlayPause').addEventListener('click', (e) => {
            e.stopPropagation(); // منع انتقال اللمس للخلفية
            player.togglePlay();
        });

        document.getElementById('btnForward').addEventListener('click', (e) => {
            e.stopPropagation();
            player.forward(10);
            showUI(); // جدد وقت الظهور
        });

        document.getElementById('btnRewind').addEventListener('click', (e) => {
            e.stopPropagation();
            player.rewind(10);
            showUI();
        });

        // 5. ربط حالة المشغل بالأيقونات
        player.on('play', () => {
            iconPlay.className = 'fas fa-pause';
            uiTimer = setTimeout(hideUI, 2500);
        });

        player.on('pause', () => {
            iconPlay.className = 'fas fa-play ml-1';
            showUI(); // أظهر الواجهة فوراً عند التوقف
        });

        // 6. لمسة واحدة على الشاشة تظهر/تخفي التحكم
        // (ده الحل البديل عن الدبل تاب)
        overlay.addEventListener('click', (e) => {
            // لو الضغط تم على الخلفية الفاضية مش على زرار
            if(e.target === overlay || e.target.classList.contains('center-controls')) {
                if(overlay.classList.contains('hidden-ui')) showUI();
                else hideUI();
            }
        });

        // تشغيل أولي
        showUI();

    </script>
</body>
    </html>
