<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* تخصيص ألوان المشغل */
        :root { --plyr-color-main: #ff0000; }

        /* زر التشغيل الكبير */
        .plyr__control--overlaid {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50% !important;
            padding: 25px !important;
        }
        .plyr__control--overlaid:hover { background: #ff0000 !important; border-color: #ff0000; }
        .plyr__control--overlaid svg { width: 45px !important; height: 45px !important; }

        /* شريط التحكم */
        .plyr__controls {
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent) !important;
            padding-bottom: 30px !important;
            padding-top: 60px !important;
            z-index: 20 !important;
        }

        /* ==================== العلامة المائية المتحركة (العشوائية) ==================== */
        .watermark {
            position: absolute;
            font-size: 1.2rem; 
            color: rgba(255, 255, 255, 0.15); /* شفاف جداً */
            font-weight: 900; 
            pointer-events: none; /* عشان اللمس يعدي من خلاله */
            z-index: 9999; /* فوق كل حاجة */
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            /* الأنيميشن السحري */
            animation: moveRandom 20s infinite alternate linear;
        }

        /* حركة عشوائية تغطي الشاشة */
        @keyframes moveRandom {
            0%   { top: 5%;  left: 5%;  transform: rotate(-10deg); }
            20%  { top: 80%; left: 20%; transform: rotate(5deg);   }
            40%  { top: 20%; left: 80%; transform: rotate(-5deg);  }
            60%  { top: 90%; left: 50%; transform: rotate(10deg);  }
            80%  { top: 10%; left: 90%; transform: rotate(-10deg); }
            100% { top: 50%; left: 5%;  transform: rotate(5deg);   }
        }

        /* هيدر الفيديو */
        .video-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; display: flex; align-items: center; gap: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
        .plyr--show-controls .video-header { opacity: 1; }

        .back-button {
            pointer-events: auto; color: white; width: 40px; height: 40px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(5px);
        }

        .video-title {
            color: white; font-size: 1rem; font-weight: bold;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%;
        }

        @media (min-width: 768px) {
            .video-title { font-size: 1.4rem; }
            .watermark { font-size: 1.5rem; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper">
        
        <div class="video-header">
            <button onclick="history.back()" class="back-button"><i class="fas fa-arrow-right"></i></button>
            <h1 class="video-title" id="vidTitle">...</h1>
        </div>

        <div id="player-container" class="w-full h-full"></div>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        
        // عرض الكود والاسم (لو موجود) في العلامة المائية
        const stdName = localStorage.getItem('studentName') || "";
        // بنقسم الاسم عشان ميبقاش طويل أوي في العلامة المائية (أول اسمين بس)
        const shortName = stdName.split(' ').slice(0, 2).join(' ');
        
        document.getElementById('watermark').innerText = userCode + (shortName ? " • " + shortName : "");

        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        if(!videoData) { alert("خطأ"); history.back(); }
        document.getElementById('vidTitle').innerText = videoData.video_name || videoData.name || "مشاهدة الفيديو";

        const container = document.getElementById('player-container');
        let src = videoData.stream_url || videoData.video_url || "";
        src = src.trim();

        if(src.includes('youtube') || src.includes('youtu.be')) {
            let vidId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
            container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${vidId}"></div>`;
        } else {
            container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
        }

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 2] },
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' },
            clickToPlay: true,
            hideControls: true,
            resetOnEnd: true,
        });

    </script>
</body>
</html>
