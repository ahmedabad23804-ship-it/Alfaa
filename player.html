<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الصفحة */
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .video-wrapper {
            width: 100%; height: 100vh; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* ==================== تعديلات Plyr الاحترافية (YouTube Style) ==================== */
        
        /* اللون الرئيسي (أحمر) */
        :root {
            --plyr-color-main: #ff0000;
            --plyr-video-background: #000;
            --plyr-menu-background: rgba(20, 20, 20, 0.9);
            --plyr-menu-color: #fff;
        }

        /* زر التشغيل الكبير في النص */
        .plyr__control--overlaid {
            background: rgba(0, 0, 0, 0.6) !important;
            padding: 20px !important;
            border-radius: 50% !important;
        }
        .plyr__control--overlaid:hover { background: #ff0000 !important; }

        /* شريط التحكم السفلي */
        .plyr__controls {
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.9)) !important;
            padding-bottom: 30px !important;
            padding-top: 50px !important;
            z-index: 100 !important; /* فوق أي حاجة تانية */
        }

        /* تكبير أزرار التحكم للموبايل */
        .plyr__controls .plyr__control {
            padding: 10px !important;
        }

        /* إجبار زر التكبير على الظهور */
        .plyr__control--fullscreen { display: inline-block !important; }

        /* ==================== عناصر إضافية ==================== */

        /* الهيدر العلوي (اسم الفيديو وزر الرجوع) */
        .custom-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; z-index: 50;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
            display: flex; align-items: center; gap: 15px;
            pointer-events: none; /* عشان اللمس يعدي */
            opacity: 0; transition: 0.3s;
        }
        .show-ui .custom-header { opacity: 1; pointer-events: auto; }

        .back-btn {
            background: rgba(255, 255, 255, 0.1); border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;
            backdrop-filter: blur(5px);
        }

        /* أنميشن التقديم والترجيع (Ripple) */
        .ripple-icon {
            position: absolute; top: 50%; transform: translateY(-50%) scale(0.5);
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.2);
            border-radius: 50%; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 60;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ripple-left { left: 20%; }
        .ripple-right { right: 20%; }
        
        .trigger-anim { opacity: 1; transform: translateY(-50%) scale(1.2); }

        /* مناطق اللمس الخفية (مهمة جداً) */
        .tap-zone {
            position: absolute; top: 15%; bottom: 20%; /* سايبين مساحة تحت عشان الزراير */
            width: 40%; z-index: 40; /* تحت شريط التحكم وفوق الفيديو */
        }
        .zone-left { left: 0; }
        .zone-right { right: 0; }

        /* العلامة المائية */
        .watermark {
            position: absolute; bottom: 80px; right: 20px;
            font-size: 1rem; color: rgba(255,255,255,0.2);
            font-weight: 900; pointer-events: none; z-index: 20;
            animation: floatText 15s infinite alternate;
        }
        @keyframes floatText { from { transform: translateX(0) rotate(0); } to { transform: translateX(-30px) rotate(5deg); } }

    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-wrapper" id="playerWrapper">
        
        <div class="custom-header" id="customHeader">
            <div onclick="history.back()" class="back-btn"><i class="fas fa-arrow-right"></i></div>
            <h1 class="text-white font-bold text-sm truncate max-w-[70%]" id="vidTitle">جاري التحميل...</h1>
        </div>

        <div id="ripLeft" class="ripple-icon ripple-left"><i class="fas fa-undo"></i><span class="text-xs font-bold mt-1">10s</span></div>
        <div id="ripRight" class="ripple-icon ripple-right"><i class="fas fa-redo"></i><span class="text-xs font-bold mt-1">10s</span></div>

        <div id="zoneLeft" class="tap-zone zone-left"></div>
        <div id="zoneRight" class="tap-zone zone-right"></div>

        <div id="player-container" class="w-full h-full"></div>

        <div id="watermark" class="watermark">ID: ---</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. التحقق من المستخدم
        const userCode = checkAuth();
        if(!userCode) window.location.href = 'index.html';
        document.getElementById('watermark').innerText = userCode;

        // 2. تحميل بيانات الفيديو
        const videoData = JSON.parse(localStorage.getItem('activeLecture'));
        if(!videoData) { alert("خطأ في الفيديو"); history.back(); }
        document.getElementById('vidTitle').innerText = videoData.video_name || videoData.name || "مشاهدة الدرس";

        // 3. إعداد المشغل
        const container = document.getElementById('player-container');
        let src = videoData.stream_url || videoData.video_url || "";
        src = src.trim();

        if(src.includes('youtube') || src.includes('youtu.be')) {
            let vidId = src.split('v=')[1]?.split('&')[0] || src.split('youtu.be/')[1]?.split('?')[0];
            container.innerHTML = `<div id="player" data-plyr-provider="youtube" data-plyr-embed-id="${vidId}"></div>`;
        } else {
            container.innerHTML = `<video id="player" playsinline controls><source src="${src}" type="video/mp4" /></video>`;
        }

        // تشغيل Plyr بوضع "احترافي"
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'duration', 
                'mute', 'volume', 'settings', 'fullscreen'
            ],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 2] },
            fullscreen: { enabled: true, fallback: true, iosNative: 'auto' },
            clickToPlay: true, // تفعيل الضغط للتشغيل
            hideControls: true, // إخفاء تلقائي
            resetOnEnd: true,
        });

        // 4. ربط الهيدر بالتحكم
        const wrapper = document.getElementById('playerWrapper');
        
        // لما التحكم يظهر، نظهر الهيدر بتاعنا
        player.on('controlsshown', () => wrapper.classList.add('show-ui'));
        // لما يختفي، نخفي الهيدر
        player.on('controlshidden', () => wrapper.classList.remove('show-ui'));

        // 5. منطق اللمس المزدوج (Double Tap Logic)
        const zoneL = document.getElementById('zoneLeft');
        const zoneR = document.getElementById('zoneRight');
        let lastTap = 0;

        function handleDoubleTap(e, action) {
            e.stopPropagation(); // منع تعارض مع المشغل
            const now = new Date().getTime();
            const diff = now - lastTap;

            if (diff < 300 && diff > 0) {
                // Double Tap Detected!
                if(action === 'fwd') {
                    player.forward(10);
                    showRipple('ripRight');
                } else {
                    player.rewind(10);
                    showRipple('ripLeft');
                }
            } else {
                // Single Tap -> Toggle Play/Pause (Plyr بيعملها لوحده بس ده احتياطي)
                // player.togglePlay(); 
            }
            lastTap = now;
        }

        function showRipple(id) {
            const el = document.getElementById(id);
            el.classList.add('trigger-anim');
            setTimeout(() => el.classList.remove('trigger-anim'), 500);
        }

        // استخدام click للتعرف على الدبل تاب داخل المناطق المحددة
        zoneR.addEventListener('click', (e) => handleDoubleTap(e, 'fwd'));
        zoneL.addEventListener('click', (e) => handleDoubleTap(e, 'rew'));

        // منع التكبير باللمس المزدوج للمتصفح نفسه
        wrapper.addEventListener('dblclick', (e) => {
            e.preventDefault();
        });

    </script>
</body>
</html>
