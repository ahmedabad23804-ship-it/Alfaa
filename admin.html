<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; padding-bottom: 90px; }
        
        /* إخفاء وإظهار الصفحات */
        .page-section { display: none; }
        .page-section.active-page { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1e293b; border-top: 1px solid #334155;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 50;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn {
            background: none; border: none; color: #64748b;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.75rem; font-weight: bold; width: 33%;
        }
        .nav-btn.active-btn { color: #6366f1; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 3px; }

        /* تصميم الحقول */
        input, select {
            background: #0f172a !important; border: 1px solid #334155 !important;
            color: white !important; width: 100%; padding: 12px; border-radius: 12px;
            outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body>

    <header class="p-5 bg-[#1e293b] shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-indigo-500">FULL MARK</h1>
            <p class="text-[10px] text-gray-400">لوحة التحكم</p>
        </div>
        <div class="bg-indigo-600 w-9 h-9 rounded-full flex items-center justify-center font-bold">A</div>
    </header>

    <main class="p-5">
        
        <section id="view-generate" class="page-section active-page">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-qrcode text-indigo-500"></i> إصدار كود جديد
            </h2>

            <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 shadow-xl space-y-4">
                <div>
                    <label class="text-sm text-gray-400 block mb-1">اسم الطالب</label>
                    <input type="text" id="inpName" placeholder="مثال: أحمد محمد...">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm text-gray-400 block mb-1">الشعبة</label>
                        <select id="inpSection">
                            <option value="علمي علوم">🧪 ع.علوم</option>
                            <option value="علمي رياضة">📐 ع.رياضة</option>
                            <option value="أدبي">📚 أدبي</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-gray-400 block mb-1">المدة</label>
                        <select id="inpType" onchange="checkPrice()">
                            <option value="month">شهر كامل</option>
                            <option value="trial">تجريبي (ساعة)</option>
                        </select>
                    </div>
                </div>

                <div id="priceDiv">
                    <label class="text-sm text-gray-400 block mb-1">السعر (جنية)</label>
                    <input type="number" id="inpPrice" value="100">
                </div>

                <button type="button" onclick="runGenerate()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-lg transition active:scale-95">
                    <i class="fas fa-bolt"></i> توليد الكود فوراً
                </button>
            </div>

            <div id="resultCard" class="hidden mt-6 bg-[#1e293b] p-6 rounded-2xl border-2 border-dashed border-indigo-500 text-center relative">
                <p class="text-gray-400 text-sm mb-2">تم إنشاء الكود بنجاح!</p>
                
                <div class="flex items-center justify-between bg-[#0f172a] p-4 rounded-xl border border-gray-700 mb-4">
                    <h2 id="finalCode" class="text-2xl font-mono font-bold text-indigo-400 tracking-wider">---</h2>
                    <button onclick="doCopy()" class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center active:bg-indigo-400 transition">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>

                <div class="flex justify-between text-xs font-bold text-gray-400">
                    <span id="resPrice">0 ج.م</span>
                    <span id="resType">شهر</span>
                </div>
            </div>
        </section>


        <section id="view-students" class="page-section">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-users text-indigo-500"></i> إدارة الطلاب
            </h2>

            <div class="mb-4">
                <input type="text" id="searchBox" onkeyup="filterTable()" placeholder="🔍 بحث بالاسم..." class="bg-[#1e293b]">
            </div>

            <div class="overflow-y-auto rounded-xl border border-gray-700" style="max-height: 60vh;">
                <table class="w-full text-sm text-right bg-[#1e293b]">
                    <thead class="text-xs text-gray-500 bg-gray-800 uppercase sticky top-0">
                        <tr>
                            <th class="px-4 py-3">الطالب</th>
                            <th class="px-4 py-3">الكود</th>
                            <th class="px-4 py-3 text-center">حالة</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                        </tbody>
                </table>
                <p id="noDataMsg" class="text-center py-6 text-gray-500 hidden">لا توجد بيانات</p>
            </div>
        </section>


        <section id="view-stats" class="page-section">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-chart-line text-indigo-500"></i> الأرباح والإحصائيات
            </h2>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 text-center">
                    <p class="text-xs text-gray-400 mb-1">صافي الأرباح</p>
                    <h3 class="text-2xl font-black text-green-400" id="statRev">0</h3>
                </div>
                <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 text-center">
                    <p class="text-xs text-gray-400 mb-1">عدد الأكواد</p>
                    <h3 class="text-2xl font-black text-white" id="statCount">0</h3>
                </div>
            </div>

            <div class="bg-[#1e293b] p-4 rounded-2xl border border-gray-700">
                <h4 class="font-bold mb-4 border-b border-gray-600 pb-2 text-sm">توزيع الأقسام</h4>
                <div class="h-48 relative">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button onclick="goTo('view-generate', this)" class="nav-btn active-btn">
            <i class="fas fa-plus-square"></i>
            <span>إصدار</span>
        </button>
        <button onclick="goTo('view-students', this)" class="nav-btn">
            <i class="fas fa-user-graduate"></i>
            <span>الطلاب</span>
        </button>
        <button onclick="goTo('view-stats', this)" class="nav-btn">
            <i class="fas fa-chart-pie"></i>
            <span>أرباحي</span>
        </button>
    </nav>

    <script>
        // 1. إعداد قاعدة البيانات (مهم: تأكد إن الرابط ده بتاعك)
        const firebaseConfig = { databaseURL: "https://fullmark-2025-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. دالة التنقل بين الصفحات (مضمونة 100%)
        function goTo(pageId, btnElement) {
            // إخفاء كل الصفحات
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active-page'));
            // إظهار الصفحة المطلوبة
            document.getElementById(pageId).classList.add('active-page');

            // تحديث ألوان الأزرار
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-btn'));
            if(btnElement) btnElement.classList.add('active-btn');
        }

        // 3. التحكم في خانة السعر
        function checkPrice() {
            const type = document.getElementById('inpType').value;
            const priceInp = document.getElementById('inpPrice');
            if(type === 'trial') {
                priceInp.value = 0;
                priceInp.disabled = true;
                priceInp.style.opacity = '0.5';
            } else {
                priceInp.value = 100;
                priceInp.disabled = false;
                priceInp.style.opacity = '1';
            }
        }

        // 4. دالة توليد الكود (الأساسية)
        function runGenerate() {
            // جلب البيانات
            const name = document.getElementById('inpName').value;
            const section = document.getElementById('inpSection').value;
            const type = document.getElementById('inpType').value;
            let price = document.getElementById('inpPrice').value;

            // التحقق من الاسم
            if(name.trim() === "") {
                alert("⚠️ لازم تكتب اسم الطالب الأول!");
                return;
            }

            // تجهيز الكود والوقت
            const code = 'FM-' + Math.floor(10000 + Math.random() * 90000);
            const now = new Date();
            let expiry = new Date();

            if(type === 'trial') {
                expiry.setHours(expiry.getHours() + 1); // ساعة واحدة
                price = 0;
            } else {
                expiry.setDate(expiry.getDate() + 30); // 30 يوم
            }

            // إرسال لـ Firebase
            db.ref('approvedStudents/' + code).set({
                studentName: name,
                section: section,
                subscriptionType: type,
                price: parseInt(price),
                expiryDate: expiry.getTime(),
                isBlocked: false,
                createdAt: now.getTime()
            }, (error) => {
                if (error) {
                    alert('❌ حصل خطأ في الاتصال، جرب تاني.');
                } else {
                    // نجاح العملية
                    document.getElementById('resultCard').classList.remove('hidden');
                    document.getElementById('finalCode').innerText = code;
                    document.getElementById('resPrice').innerText = price + ' ج.م';
                    document.getElementById('resType').innerText = (type === 'trial') ? 'تجريبي' : 'شهر';
                    
                    // تفريغ خانة الاسم
                    document.getElementById('inpName').value = '';
                }
            });
        }

        // 5. دالة النسخ
        function doCopy() {
            const code = document.getElementById('finalCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('✅ تم نسخ الكود: ' + code);
            });
        }

        // 6. تحميل بيانات الطلاب والإحصائيات
        let chartInstance = null;
        
        db.ref('approvedStudents').on('value', (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('studentsBody');
            tableBody.innerHTML = ''; // مسح القديم

            let totalRev = 0;
            let totalCount = 0;
            let sections = { sci: 0, math: 0, lit: 0 };

            if(data) {
                document.getElementById('noDataMsg').classList.add('hidden');
                
                Object.keys(data).forEach(key => {
                    const student = data[key];
                    totalCount++;
                    totalRev += (student.price || 0);

                    // عد الشعب
                    if(student.section.includes('علوم')) sections.sci++;
                    else if(student.section.includes('رياضة')) sections.math++;
                    else sections.lit++;

                    // إضافة للجدول
                    const row = `
                        <tr class="border-b border-gray-800">
                            <td class="px-4 py-3 font-bold">${student.studentName}</td>
                            <td class="px-4 py-3 font-mono text-indigo-400">${key}</td>
                            <td class="px-4 py-3 text-center">
                                <span class="${student.subscriptionType === 'trial' ? 'text-yellow-500' : 'text-green-500'} text-xs font-bold">
                                    ${student.subscriptionType === 'trial' ? 'تجريبي' : 'مشترك'}
                                </span>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                document.getElementById('noDataMsg').classList.remove('hidden');
            }

            // تحديث الأرقام
            document.getElementById('statRev').innerText = totalRev.toLocaleString();
            document.getElementById('statCount').innerText = totalCount;

            // تحديث الرسم البياني
            updateChart(sections);
        });

        function updateChart(data) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['علوم', 'رياضة', 'أدبي'],
                    datasets: [{
                        data: [data.sci, data.math, data.lit],
                        backgroundColor: ['#3b82f6', '#ef4444', '#eab308'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: 'white' } } }
                }
            });
        }

        // دالة البحث
        function filterTable() {
            const input = document.getElementById('searchBox');
            const filter = input.value.toUpperCase();
            const rows = document.getElementById('studentsBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                const td = rows[i].getElementsByTagName("td")[0];
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        rows[i].style.display = "";
                    } else {
                        rows[i].style.display = "none";
                    }
                }       
            }
        }
    </script>
</body>
</html>
