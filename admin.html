<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FULL MARK Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; padding-bottom: 90px; }
        
        .page-section { display: none; }
        .page-section.active-page { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1e293b; border-top: 1px solid #334155;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 50;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .nav-btn {
            background: none; border: none; color: #64748b;
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.75rem; font-weight: bold; width: 33%;
        }
        .nav-btn.active-btn { color: #6366f1; transform: translateY(-2px); }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 3px; }

        input, select {
            background: #0f172a !important; border: 1px solid #334155 !important;
            color: white !important; width: 100%; padding: 12px; border-radius: 12px;
            outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: #6366f1 !important; }

        /* ستايل الصفوف القابلة للنقر */
        .clickable-row { cursor: pointer; transition: 0.2s; }
        .clickable-row:active { background-color: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body>

    <header class="p-5 bg-[#1e293b] shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-indigo-500 tracking-wider">FULL MARK</h1>
            <p class="text-[10px] text-gray-400">لوحة التحكم</p>
        </div>
        <div class="bg-indigo-600 w-9 h-9 rounded-full flex items-center justify-center font-bold">A</div>
    </header>

    <main class="p-5">
        
        <section id="view-generate" class="page-section active-page">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-qrcode text-indigo-500"></i> إصدار كود
            </h2>
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 shadow-xl space-y-4">
                <div>
                    <label class="text-sm text-gray-400 block mb-1">اسم الطالب</label>
                    <input type="text" id="inpName" placeholder="اكتب الاسم...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm text-gray-400 block mb-1">الشعبة</label>
                        <select id="inpSection">
                            <option value="علمي علوم">🧪 ع.علوم</option>
                            <option value="علمي رياضة">📐 ع.رياضة</option>
                            <option value="أدبي">📚 أدبي</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-gray-400 block mb-1">المدة</label>
                        <select id="inpType" onchange="checkPrice()">
                            <option value="month">شهر كامل</option>
                            <option value="trial">تجريبي (ساعة)</option>
                        </select>
                    </div>
                </div>
                <div id="priceDiv">
                    <label class="text-sm text-gray-400 block mb-1">السعر</label>
                    <input type="number" id="inpPrice" value="100">
                </div>
                <button type="button" onclick="runGenerate()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold flex items-center justify-center gap-2 text-lg">
                    <i class="fas fa-bolt"></i> توليد الكود
                </button>
            </div>
            
            <div id="resultCard" class="hidden mt-6 bg-[#1e293b] p-6 rounded-2xl border border-indigo-500 text-center relative">
                <p class="text-green-400 font-bold mb-2">✅ تم الإنشاء</p>
                <div class="bg-[#0f172a] p-3 rounded-xl border border-gray-700 mb-2 flex justify-between items-center">
                    <h2 id="finalCode" class="text-xl font-mono font-bold text-white tracking-widest">---</h2>
                    <button onclick="doCopy()" class="text-indigo-400 p-2"><i class="fas fa-copy fa-lg"></i></button>
                </div>
            </div>
        </section>

        <section id="view-students" class="page-section">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-users text-indigo-500"></i> الطلاب
            </h2>
            <div class="mb-4">
                <input type="text" id="searchBox" onkeyup="filterTable()" placeholder="🔍 ابحث بالاسم أو الكود..." class="bg-[#1e293b]">
            </div>
            <div class="overflow-y-auto rounded-xl border border-gray-700" style="max-height: 65vh;">
                <table class="w-full text-sm text-right bg-[#1e293b]">
                    <thead class="text-xs text-gray-500 bg-gray-800 uppercase sticky top-0">
                        <tr>
                            <th class="px-4 py-3">الطالب</th>
                            <th class="px-4 py-3">الكود</th>
                            <th class="px-4 py-3 text-center">الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody"></tbody>
                </table>
                <p id="noDataMsg" class="text-center py-6 text-gray-500 hidden">لا توجد بيانات</p>
            </div>
        </section>

        <section id="view-stats" class="page-section">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-chart-line text-indigo-500"></i> الإحصائيات
            </h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 text-center">
                    <p class="text-xs text-gray-400">الأرباح</p>
                    <h3 class="text-2xl font-black text-green-400" id="statRev">0</h3>
                </div>
                <div class="bg-[#1e293b] p-5 rounded-2xl border border-gray-700 text-center">
                    <p class="text-xs text-gray-400">الطلاب</p>
                    <h3 class="text-2xl font-black text-white" id="statCount">0</h3>
                </div>
            </div>
            <div class="bg-[#1e293b] p-4 rounded-2xl border border-gray-700">
                <div class="h-48 relative"><canvas id="myChart"></canvas></div>
            </div>
        </section>
    </main>

    <div id="studentModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] w-full max-w-sm rounded-2xl p-6 relative border border-gray-600 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-gray-400 text-xl"><i class="fas fa-times"></i></button>
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-full mx-auto mb-3 flex items-center justify-center text-2xl font-bold shadow-lg shadow-indigo-500/30" id="mInitials">A</div>
                <h3 class="text-xl font-bold text-white" id="mName">اسم الطالب</h3>
                <p class="text-indigo-400 font-mono text-sm tracking-widest bg-black/20 inline-block px-3 py-1 rounded-lg mt-1" id="mCode">---</p>
                <div class="mt-2 text-xs text-gray-400" id="mExpiry">ينتهي في: ...</div>
            </div>

            <div class="space-y-3">
                <button onclick="renewUser()" class="w-full bg-green-600 hover:bg-green-500 text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                    <i class="fas fa-calendar-plus"></i> تجديد 30 يوم
                </button>
                
                <button onclick="resetDeviceID()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                    <i class="fas fa-mobile-alt"></i> نقل لجهاز جديد (فك الربط)
                </button>

                <button onclick="toggleBlockUser()" id="btnBlock" class="w-full bg-orange-600 hover:bg-orange-500 text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                    <i class="fas fa-ban"></i> حظر الطالب
                </button>

                <button onclick="deleteUser()" class="w-full bg-red-600/10 text-red-500 border border-red-500/30 hover:bg-red-600 hover:text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                    <i class="fas fa-trash"></i> حذف نهائي
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="goTo('view-generate', this)" class="nav-btn active-btn"><i class="fas fa-plus-square"></i><span>إصدار</span></button>
        <button onclick="goTo('view-students', this)" class="nav-btn"><i class="fas fa-user-graduate"></i><span>الطلاب</span></button>
        <button onclick="goTo('view-stats', this)" class="nav-btn"><i class="fas fa-chart-pie"></i><span>أرباحي</span></button>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://fullmark-2025-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allStudents = {};
        let selectedCode = null;
        let chartInstance = null;

        function goTo(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-btn'));
            if(btn) btn.classList.add('active-btn');
        }

        function checkPrice() {
            const type = document.getElementById('inpType').value;
            const p = document.getElementById('inpPrice');
            if(type === 'trial') { p.value=0; p.disabled=true; p.style.opacity='0.5'; }
            else { p.value=100; p.disabled=false; p.style.opacity='1'; }
        }

        function runGenerate() {
            const name = document.getElementById('inpName').value;
            const section = document.getElementById('inpSection').value;
            const type = document.getElementById('inpType').value;
            const price = document.getElementById('inpPrice').value;

            if(!name) return alert("اكتب اسم الطالب");

            const code = 'FM-' + Math.floor(10000 + Math.random() * 90000);
            const now = new Date();
            let expiry = new Date();
            if(type === 'trial') expiry.setHours(expiry.getHours()+1);
            else expiry.setDate(expiry.getDate()+30);

            db.ref('approvedStudents/'+code).set({
                studentName: name, section, subscriptionType: type, price: parseInt(price),
                expiryDate: expiry.getTime(), isBlocked: false, deviceId: null, createdAt: now.getTime()
            }, (e) => {
                if(!e) {
                    document.getElementById('resultCard').classList.remove('hidden');
                    document.getElementById('finalCode').innerText = code;
                    document.getElementById('inpName').value = '';
                }
            });
        }

        function doCopy() {
            navigator.clipboard.writeText(document.getElementById('finalCode').innerText);
            alert("تم النسخ");
        }

        // ================= تحميل البيانات (المهم جداً) =================
        db.ref('approvedStudents').on('value', snap => {
            const data = snap.val();
            allStudents = data || {};
            renderTable(allStudents);
            updateStats(allStudents);
        });

        function renderTable(data) {
            const tbody = document.getElementById('studentsBody');
            tbody.innerHTML = '';
            let hasData = false;

            for(let code in data) {
                hasData = true;
                const s = data[code];
                const name = s.studentName || "بدون اسم";
                const isBlocked = s.isBlocked;
                
                // هنا الجزء اللي بيخلي الصف قابل للنقر
                const row = `
                    <tr onclick="openModal('${code}')" class="clickable-row border-b border-gray-800 hover:bg-white/5">
                        <td class="px-4 py-3">
                            <div class="font-bold ${isBlocked ? 'text-red-400 line-through' : 'text-white'}">${name}</div>
                            <div class="text-[10px] text-gray-500">${s.section}</div>
                        </td>
                        <td class="px-4 py-3 font-mono text-indigo-400">${code}</td>
                        <td class="px-4 py-3 text-center">
                            <span class="${s.subscriptionType === 'trial' ? 'text-yellow-500' : 'text-green-500'} text-xs font-bold">
                                ${isBlocked ? 'محظور' : (s.subscriptionType==='trial'?'تجريبي':'مشترك')}
                            </span>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
            document.getElementById('noDataMsg').style.display = hasData ? 'none' : 'block';
        }

        // ================= وظائف المودال (النافذة) =================
        function openModal(code) {
            selectedCode = code;
            const s = allStudents[code];
            
            document.getElementById('mName').innerText = s.studentName || "بدون اسم";
            document.getElementById('mCode').innerText = code;
            document.getElementById('mInitials').innerText = (s.studentName || "?").charAt(0);
            document.getElementById('mExpiry').innerText = "ينتهي: " + new Date(s.expiryDate).toLocaleDateString('ar-EG');
            
            // تحديث زر الحظر حسب الحالة
            const btnBlock = document.getElementById('btnBlock');
            if(s.isBlocked) {
                btnBlock.innerHTML = '<i class="fas fa-unlock"></i> فك الحظر';
                btnBlock.className = btnBlock.className.replace('bg-orange-600', 'bg-blue-600');
            } else {
                btnBlock.innerHTML = '<i class="fas fa-ban"></i> حظر الطالب';
                btnBlock.className = btnBlock.className.replace('bg-blue-600', 'bg-orange-600');
            }

            document.getElementById('studentModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('studentModal').classList.add('hidden');
        }

        // 1. نقل لجهاز جديد (فك الربط)
        function resetDeviceID() {
            if(confirm("هل تريد السماح للطالب بالدخول من جهاز جديد؟")) {
                db.ref('approvedStudents/'+selectedCode).update({ deviceId: null });
                alert("✅ تم فك الربط! يمكن للطالب الدخول الآن من جهاز جديد.");
                closeModal();
            }
        }

        // 2. تجديد الاشتراك
        function renewUser() {
            if(confirm("تجديد الاشتراك 30 يوم؟")) {
                const now = new Date();
                now.setDate(now.getDate()+30);
                db.ref('approvedStudents/'+selectedCode).update({ 
                    expiryDate: now.getTime(), subscriptionType: 'month', isBlocked: false 
                });
                closeModal();
                alert("✅ تم التجديد");
            }
        }

        // 3. حظر / فك حظر
        function toggleBlockUser() {
            const currentStatus = allStudents[selectedCode].isBlocked;
            const msg = currentStatus ? "فك الحظر؟" : "حظر الطالب ومنعه من الدخول؟";
            if(confirm(msg)) {
                db.ref('approvedStudents/'+selectedCode).update({ isBlocked: !currentStatus });
                closeModal();
            }
        }

        // 4. حذف نهائي
        function deleteUser() {
            if(confirm("⚠️ حذف نهائي؟ لا يمكن التراجع!")) {
                db.ref('approvedStudents/'+selectedCode).remove();
                closeModal();
            }
        }

        function updateStats(data) {
            let rev=0, cnt=0, sci=0, math=0, lit=0;
            for(let k in data) {
                const s = data[k];
                rev += (s.price||0);
                cnt++;
                if(s.section.includes('علوم')) sci++;
                else if(s.section.includes('رياضة')) math++;
                else lit++;
            }
            document.getElementById('statRev').innerText = rev.toLocaleString();
            document.getElementById('statCount').innerText = cnt;

            const ctx = document.getElementById('myChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['علوم', 'رياضة', 'أدبي'],
                    datasets: [{ data: [sci, math, lit], backgroundColor: ['#3b82f6', '#ef4444', '#eab308'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: 'white' } } } }
            });
        }

        function filterTable() {
            const val = document.getElementById('searchBox').value.toLowerCase();
            const rows = document.getElementById('studentsBody').getElementsByTagName('tr');
            for(let r of rows) {
                r.style.display = r.innerText.toLowerCase().includes(val) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
