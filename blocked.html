<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم حظر الحساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .blocked-card {
            background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 30px;
            padding: 40px; text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.15);
            animation: shake 0.5s ease-in-out;
        }
        .icon-box {
            width: 80px; height: 80px; background: rgba(239, 68, 68, 0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: #ef4444; font-size: 2.5rem;
            border: 2px solid rgba(239, 68, 68, 0.2);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <div class="blocked-card">
        <div class="icon-box">
            <i class="fas fa-user-lock"></i>
        </div>
        
        <h1 class="text-2xl font-black text-red-500 mb-2">عفواً، تم حظرك!</h1>
        <p class="text-gray-300 text-sm mb-6">
            أهلاً <span id="stdName" class="text-white font-bold">...</span><br>
            لقد قامت الإدارة بتعليق حسابك مؤقتاً. لا يمكنك الدخول للمنصة حالياً.
        </p>

        <div class="space-y-3">
            <a href="https://t.me/YOUR_TELEGRAM_LINK" target="_blank" class="block w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition flex items-center justify-center gap-2">
                <i class="fab fa-telegram-plane"></i> تواصل مع الدعم لفك الحظر
            </a>
            
            <button onclick="logout()" class="block w-full py-3 bg-white/5 hover:bg-white/10 text-gray-400 rounded-xl font-bold transition">
                تسجيل خروج
            </button>
        </div>
        
        <p class="text-[10px] text-gray-600 mt-6">FULL MARK SYSTEM SECURITY</p>
    </div>

    <script>
        // جلب الاسم من الذاكرة لعرضه
        const name = localStorage.getItem('studentName') || "طالب";
        document.getElementById('stdName').innerText = name;

        function logout() {
            localStorage.removeItem('alpha_user_code');
            localStorage.removeItem('studentName');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
