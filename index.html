<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | FULL MARK</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 🎨 ثيم منصة FULL MARK */
        :root {
            --primary-blue: #3b82f6;
            --accent-gold: #fbbf24;
            --bg-dark: #020617;
            --glass-bg: rgba(30, 41, 59, 0.6);
            --error-red: #ef4444;
            --success-green: #10b981;
            --telegram-color: #229ED9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1e1b4b, #020617 90%);
            overflow: hidden; color: white; padding: 20px;
        }

        /* 🌌 النجوم والشهب */
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .star {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
            animation: twinkle var(--duration) infinite ease-in-out; opacity: 0;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }

        /* 💳 كارت الدخول */
        .login-card {
            background: var(--glass-bg);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 24px; padding: 40px;
            width: 100%; max-width: 420px; text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative; overflow: hidden;
            animation: floatUp 0.8s ease-out;
            margin-bottom: 20px;
        }
        @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* خط علوي ملون */
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-gold), var(--primary-blue));
        }

        /* 👑 الهيدر والجمل المتحركة */
        h2 {
            font-family: 'Cairo', sans-serif; margin-bottom: 5px; font-size: 2rem; font-weight: 900;
            background: linear-gradient(to right, #fff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .typewriter-container {
            min-height: 25px; margin-bottom: 25px;
        }
        .typewriter-text {
            color: var(--accent-gold); font-size: 0.95rem; font-weight: bold;
            border-left: 2px solid var(--primary-blue); padding-left: 5px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 50% { border-color: transparent; } }

        /* ⌨️ المدخلات */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 15px 50px 15px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; color: white; font-size: 1.1rem;
            text-align: center; outline: none; transition: 0.3s;
            font-family: monospace; font-weight: bold; letter-spacing: 2px;
        }
        .input-group input:focus { border-color: var(--primary-blue); background: rgba(15, 23, 42, 0.9); }
        .input-group .icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-blue); }

        .login-btn {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: linear-gradient(135deg, var(--primary-blue), #4f46e5);
            color: white; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5); }
        .login-btn:disabled { opacity: 0.7; cursor: wait; }

        /* 📞 زر التواصل (تيليجرام) */
        .contact-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(34, 158, 217, 0.15); color: var(--telegram-color);
            border: 1px solid rgba(34, 158, 217, 0.3);
            padding: 10px 25px; border-radius: 50px;
            font-weight: bold; text-decoration: none; font-size: 0.9rem;
            transition: 0.3s; cursor: pointer;
            box-shadow: 0 0 15px rgba(34, 158, 217, 0.1);
        }
        .contact-btn:hover {
            background: var(--telegram-color); color: white;
            box-shadow: 0 0 20px rgba(34, 158, 217, 0.4); transform: translateY(-2px);
        }

        /* ⏱️ قسم الدخول التلقائي */
        #autoLoginSection { display: none; }
        
        .countdown-container { position: relative; width: 120px; height: 120px; margin: 0 auto 25px; }
        .progress-ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
        .progress-ring__circle-bg { stroke: rgba(251, 191, 36, 0.2); }
        .progress-ring__circle {
            stroke: var(--accent-gold); stroke-dasharray: 326.7256; stroke-dashoffset: 326.7256;
            transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 8px var(--accent-gold));
        }
        .timer-display {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2.5rem; font-weight: 900; color: var(--accent-gold);
        }
        
        .welcome-text { color: #fff; font-size: 1.2rem; margin-bottom: 5px; font-weight: bold; }
        .code-badge { 
            background: rgba(251, 191, 36, 0.1); color: var(--accent-gold); 
            padding: 5px 15px; border-radius: 20px; font-family: monospace; 
            border: 1px solid rgba(251, 191, 36, 0.3); display: inline-block; margin-bottom: 20px;
        }
        
        .cancel-btn {
            background: rgba(239, 68, 68, 0.15); color: #fca5a5;
            padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.3);
            cursor: pointer; font-size: 0.9rem; transition: 0.3s; width: 100%;
        }
        .cancel-btn:hover { background: rgba(239, 68, 68, 0.3); color: white; }

        /* رسائل الحالة */
        #statusMessage { margin-bottom: 15px; padding: 10px; border-radius: 10px; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>

    <div class="stars-bg">
        <div class="star" style="top:10%; left:20%; --duration:3s"></div>
        <div class="star" style="top:50%; left:80%; --duration:5s"></div>
        <div class="star" style="top:80%; left:30%; --duration:4s"></div>
    </div>

    <div class="login-card">
        
        <div class="mb-2">
            <i class="fas fa-crown text-4xl text-yellow-400 mb-2 drop-shadow-lg"></i>
            <h2>FULL MARK</h2>
            
            <div class="typewriter-container">
                <span class="typewriter-text" id="typingText"></span>
            </div>
        </div>

        <div id="statusMessage"></div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-key icon"></i>
                <input type="text" id="activationCode" placeholder="أدخل كود التفعيل" maxlength="15" autocomplete="off" required>
            </div>
            <button type="submit" id="loginBtn" class="login-btn">
                تفعيل ودخول <i class="fas fa-rocket mr-2"></i>
            </button>
        </form>

        <div id="autoLoginSection">
            <div class="welcome-text">مرحباً بك مجدداً 👋</div>
            <div class="code-badge" id="savedCodeDisplay">...</div>
            
            <div class="countdown-container">
                <svg class="progress-ring" width="120" height="120">
                    <circle class="progress-ring__circle-bg" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                    <circle class="progress-ring__circle" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                </svg>
                <div class="timer-display" id="timerDisplay">5</div>
            </div>
            
            <p class="text-gray-400 text-xs mb-4">جاري الدخول التلقائي...</p>
            
            <button onclick="cancelAutoLogin()" class="cancel-btn">
                إلغاء واستخدام كود آخر
            </button>
        </div>

    </div>

    <a href="https://t.me/giza_full_mark" target="_blank" class="contact-btn">
        <i class="fab fa-telegram-plane text-xl"></i>
        <span>تواصل للدعم الفني</span>
    </a>

    <div style="position:fixed; bottom:15px; width:100%; text-align:center; opacity:0.7; font-size:0.8rem; pointer-events:none;">
        <span style="color:#fbbf24; font-weight:bold;">ELGIZAWY</span> <span style="color:#94a3b8;">Developed By</span>
    </div>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD1QB3qaFfkGYq0OWOEAr83V25NAPFwxzs",
            authDomain: "fullmark-2025.firebaseapp.com",
            databaseURL: "https://fullmark-2025-default-rtdb.firebaseio.com",
            projectId: "fullmark-2025",
            storageBucket: "fullmark-2025.firebasestorage.app",
            messagingSenderId: "963956202032",
            appId: "1:963956202032:web:4df914457d79b75dee2bf5"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Typing Effect (جمل ترحيبية متحركة)
        const phrases = [
            "مسارك نحو التفوق 🚀",
            "أقوى منصة تعليمية 💪",
            "حلمك يستاهل تعبك ✨",
            "ابدأ رحلة النجاح الآن 🎓"
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeSpeed = 100;
        const deleteSpeed = 50;
        const pauseTime = 2000;
        const typingElement = document.getElementById("typingText");

        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                typingElement.textContent = currentPhrase.substring(0, charIndex--);
            } else {
                typingElement.textContent = currentPhrase.substring(0, charIndex++);
            }

            let nextSpeed = isDeleting ? deleteSpeed : typeSpeed;

            if (!isDeleting && charIndex === currentPhrase.length + 1) {
                isDeleting = true;
                nextSpeed = pauseTime;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
            }

            setTimeout(typeEffect, nextSpeed);
        }
        // بدء الكتابة عند التحميل
        document.addEventListener('DOMContentLoaded', typeEffect);


        // 3. Elements & Logic
        const loginForm = document.getElementById('loginForm');
        const autoLoginSection = document.getElementById('autoLoginSection');
        const timerDisplay = document.getElementById('timerDisplay');
        const savedCodeDisplay = document.getElementById('savedCodeDisplay');
        const statusMsg = document.getElementById('statusMessage');
        const progressCircle = document.querySelector('.progress-ring__circle');
        let autoLoginTimer;

        function showMsg(text, type) {
            statusMsg.textContent = text;
            statusMsg.style.display = 'block';
            if(type === 'error') {
                statusMsg.style.background = 'rgba(239, 68, 68, 0.2)';
                statusMsg.style.color = '#f87171';
                statusMsg.style.border = '1px solid #ef4444';
            } else {
                statusMsg.style.background = 'rgba(16, 185, 129, 0.2)';
                statusMsg.style.color = '#34d399';
                statusMsg.style.border = '1px solid #10b981';
            }
        }

        function getDeviceID() {
            let did = localStorage.getItem('localDeviceId');
            if (!did) {
                did = 'DID-' + Math.random().toString(36).substring(2, 10).toUpperCase() + Date.now().toString(36);
                localStorage.setItem('localDeviceId', did);
            }
            return did;
        }
        
        function setProgress(percent) {
            const circumference = 326.7256;
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        // 4. Auto Login
        const savedCode = localStorage.getItem('alpha_user_code');
        
        if (savedCode) {
            loginForm.style.display = 'none';
            autoLoginSection.style.display = 'block';
            savedCodeDisplay.innerText = savedCode;
            
            let seconds = 5;
            timerDisplay.innerText = seconds;
            setProgress(100);

            checkCode(savedCode, true).then(isValid => {
                if(isValid) {
                    autoLoginTimer = setInterval(() => {
                        seconds--;
                        timerDisplay.innerText = seconds;
                        setProgress((seconds / 5) * 100);
                        
                        if (seconds <= 0) {
                            clearInterval(autoLoginTimer);
                            window.location.href = 'subjects.html';
                        }
                    }, 1000);
                } else {
                    cancelAutoLogin();
                }
            });
        }

        function cancelAutoLogin() {
            clearInterval(autoLoginTimer);
            localStorage.removeItem('alpha_user_code');
            autoLoginSection.style.display = 'none';
            loginForm.style.display = 'block';
        }

        // 5. Manual Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('activationCode').value.trim();
            const btn = document.getElementById('loginBtn');
            
            if (code.length < 3) return showMsg('⚠️ اكتب كود صحيح', 'error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            
            const isValid = await checkCode(code, false);
            
            if (isValid) {
                localStorage.setItem('alpha_user_code', code);
                showMsg('✅ تم التفعيل! جاري الدخول...', 'success');
                setTimeout(() => window.location.href = 'subjects.html', 1500);
            } else {
                btn.disabled = false;
                btn.innerHTML = 'تفعيل ودخول <i class="fas fa-rocket mr-2"></i>';
            }
        });

        // 6. Validation
        async function checkCode(code, isSilent) {
            try {
                const snap = await db.ref('approvedStudents/' + code).once('value');
                const data = snap.val();
                const deviceId = getDeviceID();
                const now = Date.now();

                if (!data) throw new Error("الكود غير صحيح");
                if (data.expiryDate && data.expiryDate <= now) throw new Error("انتهت صلاحية الكود");
                if (data.isBlocked) throw new Error("تم حظر هذا الكود");
                
                if (data.deviceId && data.deviceId !== deviceId) {
                    throw new Error("هذا الكود مسجل على جهاز آخر");
                }

                if (!data.deviceId) {
                    await db.ref('approvedStudents/' + code).update({ deviceId: deviceId });
                }

                return true;

            } catch (err) {
                if (!isSilent) showMsg('❌ ' + err.message, 'error');
                return false;
            }
        }
    </script>
</body>
</html>
