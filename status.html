<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الاشتراك | FULL MARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 0%, #1e1b4b, #020617 70%);
        }

        /* الكارت الزجاجي */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 32px;
            padding: 40px;
            width: 90%; max-width: 450px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* العداد الرقمي */
        .digit-box {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 10px; border-radius: 18px;
            min-width: 70px; text-align: center;
            transition: 0.3s;
        }
        .digit-box:hover { border-color: #6366f1; transform: translateY(-3px); }

        .digit-val { 
            font-size: 2.2rem; font-weight: 900; 
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(to bottom, #fff, #c7d2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .digit-label { color: #94a3b8; font-size: 0.75rem; margin-top: 5px; font-weight: bold; }

        /* أيقونة التاج */
        .crown-icon { 
            font-size: 3.5rem; 
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 15px rgba(251, 191, 36, 0.3));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* شريط الحالة */
        .status-badge {
            padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: bold;
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .status-badge.active { background: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34, 197, 94, 0.2); }
        .status-badge.expired { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.2); }

        .user-code {
            font-family: 'Outfit', monospace; letter-spacing: 4px; 
            font-size: 1.2rem; color: #6366f1; font-weight: bold;
            background: rgba(99, 102, 241, 0.1); padding: 10px 20px;
            border-radius: 12px; display: inline-block; margin-top: 10px;
            border: 1px dashed rgba(99, 102, 241, 0.3);
        }
    </script>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-card text-center">
        <div class="mb-8">
            <i class="fas fa-crown crown-icon mb-4 block"></i>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-indigo-200 to-indigo-500 mb-2">
                FULL MARK VIP
            </h1>
            <p id="studentNameDisplay" class="text-gray-400 font-bold text-lg animate-pulse">جاري التحميل...</p>
        </div>

        <div class="flex justify-between items-center mb-8 px-2">
            <div id="statusIndicator" class="status-badge">
                <i class="fas fa-circle-notch fa-spin"></i> فحص...
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">EXPIRY DATE</p>
                <p id="expiryDateDisplay" class="text-sm font-bold text-white">-</p>
            </div>
        </div>

        <div class="mb-8">
            <p class="text-sm text-indigo-300 mb-4 font-bold">الوقت المتبقي لانتهاء اشتراكك</p>
            <div class="flex justify-center gap-3" dir="ltr">
                <div class="digit-box"><div class="digit-val" id="dDays">00</div><div class="digit-label">DAYS</div></div>
                <div class="digit-box"><div class="digit-val" id="dHours">00</div><div class="digit-label">HOURS</div></div>
                <div class="digit-box"><div class="digit-val" id="dMins">00</div><div class="digit-label">MINS</div></div>
            </div>
        </div>

        <div class="mb-8">
            <p class="text-xs text-gray-500 mb-1">كود الطالب</p>
            <div id="codeShow" class="user-code">------</div>
        </div>

        <button onclick="window.history.back()" class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 font-bold text-white shadow-lg hover:shadow-indigo-500/25 hover:scale-[1.02] transition-all">
            العودة للمنصة <i class="fas fa-arrow-left mr-2"></i>
        </button>

    </div>

    <script>
        // إعدادات Firebase والتحقق من المستخدم
        const code = checkAuth(); // من ملف auth.js
        if(!code) window.location.href = 'index.html';

        document.getElementById('codeShow').innerText = code;

        const db = firebase.database();
        
        // جلب بيانات الطالب
        db.ref('approvedStudents/' + code).once('value').then(snap => {
            const data = snap.val();
            if(data) {
                // عرض الاسم
                document.getElementById('studentNameDisplay').classList.remove('animate-pulse');
                document.getElementById('studentNameDisplay').innerText = data.studentName;
                document.getElementById('studentNameDisplay').classList.add('text-indigo-300');

                // عرض تاريخ الانتهاء
                const expDate = new Date(data.expiryDate);
                document.getElementById('expiryDateDisplay').innerText = expDate.toLocaleDateString('en-GB');

                // بدء العداد
                startTimer(data.expiryDate, data.isBlocked);
            } else {
                alert("بيانات الطالب غير موجودة!");
                window.location.href = 'index.html';
            }
        });

        function startTimer(expiryTimestamp, isBlocked) {
            const statusEl = document.getElementById('statusIndicator');
            
            // تحديث الحالة فوراً
            const updateStatus = (distance) => {
                if (isBlocked) {
                    statusEl.className = 'status-badge expired';
                    statusEl.innerHTML = '<i class="fas fa-ban"></i> حساب محظور';
                    return;
                }
                if (distance < 0) {
                    statusEl.className = 'status-badge expired';
                    statusEl.innerHTML = '<i class="fas fa-times-circle"></i> انتهت الصلاحية';
                } else {
                    statusEl.className = 'status-badge active';
                    statusEl.innerHTML = '<i class="fas fa-check-circle"></i> اشتراك نشط';
                }
            };

            // دالة العداد
            const timer = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiryTimestamp - now;

                updateStatus(distance);

                if (distance < 0) {
                    clearInterval(timer);
                    document.getElementById('dDays').innerText = "00";
                    document.getElementById('dHours').innerText = "00";
                    document.getElementById('dMins').innerText = "00";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById('dDays').innerText = days < 10 ? "0"+days : days;
                document.getElementById('dHours').innerText = hours < 10 ? "0"+hours : hours;
                document.getElementById('dMins').innerText = minutes < 10 ? "0"+minutes : minutes;
            }, 1000);
        }
    </script>
</body>
                                        </html>
