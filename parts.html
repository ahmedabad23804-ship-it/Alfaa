<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجزاء المحاضرة | FULL MARK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="auth.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #00040f; color: white; font-family: 'Tajawal', sans-serif; min-height: 100vh; padding-bottom: 50px; overflow-x: hidden; }
        
        .bg-glow { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: radial-gradient(circle at 50% -10%, #1e1b4b, #00040f 80%); 
        }

        /* خلفية النجوم */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }
        .star {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
            animation: twinkle var(--duration) infinite ease-in-out; opacity: 0;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }
        
        /* كارت الفيديو المتجاوب */
        .part-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%; /* عشان يملى الخانة في الـ Grid */
        }

        .part-card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.7);
            border-color: #6366f1;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
        }

        .icon-box {
            width: 55px; height: 55px; flex-shrink: 0;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: white;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .part-number {
            font-size: 0.65rem; font-weight: 800; color: #cbd5e1;
            background: rgba(255, 255, 255, 0.1); padding: 4px 10px;
            border-radius: 8px; margin-bottom: 5px; display: inline-block;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .part-title {
            font-size: 1.1rem; font-weight: 800; line-height: 1.3;
            /* حد أقصى سطرين للاسم */
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .header-glass {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            display: flex; align-items: center; gap: 15px;
        }

        .branding {
            text-align: center; margin-top: 50px; opacity: 0.3; font-size: 0.7rem; letter-spacing: 3px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="stars-container">
        <div class="star" style="top:15%; left:25%; --duration:4s"></div>
        <div class="star" style="top:60%; left:80%; --duration:6s"></div>
    </div>

    <div id="app">
        
        <div class="header-glass">
            <button onclick="window.history.back()" class="w-10 h-10 bg-white/5 rounded-xl border border-white/10 flex items-center justify-center hover:bg-white/10 transition active:scale-95 cursor-pointer">
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
            <div class="flex-1 min-w-0">
                <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-wider">محتوى الدرس</p>
                <h1 class="text-lg font-black truncate">{{ lectureTitle }}</h1>
            </div>
        </div>

        <div class="p-5 max-w-4xl mx-auto">
            
            <div v-if="videos.length > 0">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div v-for="(vid, i) in videos" :key="i" @click="playVideo(vid)" class="part-card group">
                        <div class="icon-box group-hover:scale-110 transition-transform">
                            <i class="fas fa-play ml-1"></i>
                        </div>
                        <div class="flex-1 min-w-0"> <span class="part-number">الجزء {{ i + 1 }}</span>
                            <h3 class="part-title">
                                {{ vid.video_name || vid.title || vid.name || 'فيديو شرح' }}
                            </h3>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="text-[10px] text-gray-400 bg-black/30 px-2 py-1 rounded border border-white/5">
                                    <i class="fas fa-film ml-1 text-indigo-400"></i> فيديو مسجل
                                </span>
                            </div>
                        </div>
                        <i class="fas fa-chevron-left text-gray-600 group-hover:text-indigo-400 transition-colors text-sm"></i>
                    </div>
                </div>
            </div>

            <div v-else class="text-center py-20 border border-dashed border-white/10 rounded-3xl mt-5">
                <i class="fas fa-ghost text-4xl text-gray-600 mb-4 animate-bounce"></i>
                <p class="text-gray-500 text-sm">لا توجد أجزاء للعرض في هذه المحاضرة</p>
            </div>

            <div class="branding">FULL MARK PLAYER</div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const videos = ref([]);
                const lectureTitle = ref('المحاضرة');

                // دالة التشغيل
                const playVideo = (videoObj) => {
                    localStorage.setItem('activeLecture', JSON.stringify(videoObj));
                    window.location.href = 'player.html';
                };

                onMounted(() => {
                    // التحقق من الأمان
                    const code = checkAuth();
                    if (!code) return;

                    // استرجاع البيانات
                    const vids = localStorage.getItem('selectedLectureVids');
                    const title = localStorage.getItem('selectedLectureTitle');

                    if (vids) {
                        videos.value = JSON.parse(vids);
                    }
                    if (title) {
                        lectureTitle.value = title;
                    }
                });

                return { videos, lectureTitle, playVideo };
            }
        }).mount('#app');
    </script>
</body>
    </html>
