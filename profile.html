<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام FULL MARK | الصفحة الشخصية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <header>
        <div class="user-info">
            <img src="user-avatar.png" alt="صورة المستخدم" class="user-avatar">
            <div class="user-details">
                <h1>احمد محمد</h1>
                <span class="user-title">🎓 بطل الـ FULL MARK</span>
            </div>
        </div>
        <div class="header-buttons">
            <button class="crown-btn">👑</button>
            <button class="power-btn">⏻</button>
        </div>
    </header>

    <main>
        <h2 class="main-title">نظام FULL MARK</h2>
        <p class="subtitle">مسارك للتفوق</p>

        <div class="subjects-grid">
            <div class="subject-card arabic">
                <div class="card-content">
                    <h3>لغة عربية</h3>
                    <span class="teachers-count">👨‍🏫 2 معلمين</span>
                </div>
            </div>

            <div class="subject-card english">
                <div class="card-content">
                    <h3>English</h3>
                    <span class="teachers-count">👨‍🏫 5 معلمين</span>
                </div>
            </div>

            <div class="subject-card physics">
                <div class="card-content">
                    <h3>فيزياء</h3>
                    <span class="teachers-count">👨‍🏫 4 معلمين</span>
                </div>
            </div>

            <div class="subject-card chemistry">
                <div class="card-content">
                    <h3>كيمياء</h3>
                    <span class="teachers-count">👨‍🏫 5 معلمين</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        ELGIZAWY DEVELOPMENT
    </footer>
</body>
</html>
